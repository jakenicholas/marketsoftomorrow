<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>The Passport &mdash; Markets of Tomorrow</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/media/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/media/img/favicon-512.png">
<link rel="icon" type="image/svg+xml" href="/media/img/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/media/img/favicon-180.png">
<meta name="description" content="The TMW Passport leaderboard — the members who have visited the most iconic hotels, golf courses and restaurants on our lists.">
<link rel="canonical" href="https://www.oftmw.com/passport/">
<meta property="og:type" content="website">
<meta property="og:title" content="The Passport · Markets of Tomorrow">
<meta property="og:description" content="Who has explored the most of TMW's world.">
<meta property="og:url" content="https://www.oftmw.com/passport/">
<meta property="og:image" content="https://media.oftmw.com/wix/ca3b83_93ffb2f000f94a12aa874fe44153be18~mv2.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://media.oftmw.com/wix/ca3b83_93ffb2f000f94a12aa874fe44153be18~mv2.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070807; --ink-2:#0d0f0e;
  --panel:#141714; --panel-2:#1a1d1a;
  --hair:rgba(255,255,255,.08); --hair-2:rgba(255,255,255,.14); --hair-3:rgba(255,255,255,.22);
  --white:#fff; --cream:#ECEAE5; --mute:#9AA39C; --mute-2:#C2C9C3;
  --green:#1FDF67; --green-soft:#42EB81;
  --gold:#e6c574; --gold-soft:#f0d68a;
  --purple:#A78BFA; --purple-glow:#B9A6FF;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}

/* ── Hero — image-first masthead, lifted from the Hotel Radar treatment ── */
.rank-hero{position:relative;text-align:center;padding-bottom:10px}
.rh-img{position:relative;height:min(52vh,480px);overflow:hidden}
.rh-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.95) brightness(1.02);opacity:0;transition:opacity 1.4s ease;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 40%,rgba(0,0,0,.72) 58%,rgba(0,0,0,.42) 72%,rgba(0,0,0,.18) 84%,transparent 97%);
  mask-image:linear-gradient(to bottom,#000 0%,#000 40%,rgba(0,0,0,.72) 58%,rgba(0,0,0,.42) 72%,rgba(0,0,0,.18) 84%,transparent 97%)}
.rh-img img.on{opacity:1}
.rh-inner{position:relative;z-index:2;margin-top:-58px;padding:0 22px;max-width:760px;margin-left:auto;margin-right:auto}
.rh-kicker{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft)}
.rh-title{font-family:var(--serif);font-weight:500;font-size:clamp(44px,8vw,74px);line-height:1;margin:14px 0 14px;color:#fff}
.rh-sub{color:var(--mute-2);font-size:16px;line-height:1.6;font-weight:300;max-width:52ch;margin:0 auto}
.rh-tabs{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:26px}
.tab-btn{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid var(--hair-2);background:transparent;color:var(--mute);cursor:pointer;transition:all .16s}
.tab-btn:hover{color:#fff;border-color:var(--hair-3)}
.tab-btn.on{background:var(--green);border-color:var(--green);color:var(--ink);font-weight:700}

/* ── Board ── */
.pp-wrap{max-width:760px;margin:0 auto;padding:6px 24px 90px}
.pp-table td.c-lvl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.pp-board{margin-top:22px;overflow-x:auto;scrollbar-width:thin}
.pp-load,.pp-empty{color:var(--mute);font-size:15px;padding:44px 6px;text-align:center}
.pp-empty a{color:var(--green);text-decoration:underline;text-underline-offset:3px}
.pp-table{width:100%;border-collapse:collapse;min-width:560px}
.pp-table thead th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:center;padding:0 14px 14px;border-bottom:1px solid var(--hair);white-space:nowrap}
.pp-table th.c-rank{width:34px;padding-left:4px}
.pp-table th.c-name{text-align:left}
.pp-table th.c-num{cursor:pointer;transition:color .16s}
.pp-table th.c-num:hover{color:var(--cream)}
.pp-table th.c-num.act{color:var(--green)}
.pp-table th .car{opacity:0;margin-left:5px}
.pp-table th.c-num.act .car{opacity:1}
.pp-table tbody td{padding:16px 14px;text-align:center;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
.pp-table tbody tr:last-child td{border-bottom:none}
.pp-table td.c-rank{font-family:var(--serif);font-size:19px;color:var(--mute);text-align:center;padding-left:4px}
.pp-table tbody tr:nth-child(1) td.c-rank,.pp-table tbody tr:nth-child(2) td.c-rank,.pp-table tbody tr:nth-child(3) td.c-rank{color:var(--gold);font-weight:600}
.pp-table td.c-name{text-align:left;color:#fff;font-size:16px;font-weight:500;white-space:nowrap}
.pp-table td.c-name em{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-style:normal;margin-left:9px}
.pp-table td.c-num{font-family:var(--mono);font-size:15px;color:var(--mute-2)}
.pp-table td.c-num.zero{color:var(--mute);opacity:.45}
.pp-table td.c-total{font-family:var(--serif);font-size:21px;color:#fff}
.pp-table td.act{color:var(--green)}
.pp-table td.c-total.act{color:var(--green)}
.pp-table tbody tr.me td{background:rgba(31,223,103,.08)}
.pp-table tbody tr.me td.c-name{box-shadow:inset 3px 0 0 var(--green)}

.pp-cta{margin-top:44px;padding:28px 24px;border:1px solid var(--hair);border-radius:18px;text-align:center;background:linear-gradient(180deg,rgba(31,223,103,.05),rgba(255,255,255,.012))}
.pp-cta p{margin:0 0 14px;color:var(--cream);font-size:16px}
.pp-cta-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pp-cta-links a{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:11px 20px;border-radius:999px;border:1px solid var(--hair-2);color:var(--cream);text-decoration:none;transition:all .16s}
.pp-cta-links a:hover{border-color:var(--green);color:var(--green)}
@media(max-width:560px){.rh-inner{margin-top:-42px}.pp-table td.c-total{font-size:18px}}
</style>
</head>
<body>
  <section class="rank-hero" id="featured">
    <div class="rh-img" aria-hidden="true">
      <img class="on" src="https://media.oftmw.com/wix/ca3b83_63a8db158c3b46bca6872404ca719c6b~mv2.jpeg" alt="">
      <img src="https://media.oftmw.com/los-cabos/amanvari.jpg" alt="">
      <img src="https://media.oftmw.com/wix/ca3b83_829dcd8c0fc34ce3be4be20101831d64~mv2.webp" alt="">
    </div>
    <div class="rh-inner">
      <div class="rh-kicker">TMW Members &middot; The Passport</div>
      <h1 class="rh-title">The Passport</h1>
      <p class="rh-sub">A leaderboard of who has explored the most of our world. The iconic hotels, golf courses and restaurants on our lists. Tap &ldquo;I&rsquo;ve been&rdquo; anywhere to climb.</p>
      <div class="rh-tabs" id="ppTabs">
        <button type="button" class="tab-btn on" data-k="total">All</button>
        <button type="button" class="tab-btn" data-k="hotels">Hotels</button>
        <button type="button" class="tab-btn" data-k="restaurants">Restaurants</button>
        <button type="button" class="tab-btn" data-k="golf">Golf</button>
      </div>
    </div>
  </section>

  <main class="pp-wrap">
    <div class="pp-board" id="ppBoard"><div class="pp-load">Loading the leaderboard&hellip;</div></div>
    <div class="pp-cta">
      <p>Build your passport by exploring our lists.</p>
      <div class="pp-cta-links"><a href="/hotels/#list">Hotels</a><a href="/golf/#list">Golf</a><a href="/restaurants/#list">Restaurants</a></div>
    </div>
  </main>

  <script src="/_shared/journal-chrome.js" defer></script>
  <script src="/_shared/journal-dock.js" defer></script>
  <script>
  (function () {
    var WORKER = 'https://tmw.jake-ab7.workers.dev';
    var MEMBER_ID = null, DATA = null, SORT = 'total';   // default sort = Total

    function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function q(id){ return document.getElementById(id); }

    // ?cat= from a list page preselects that column's sort.
    var cat = (new URLSearchParams(location.search).get('cat') || '').toLowerCase();
    if (['hotels','golf','restaurants'].indexOf(cat) >= 0) SORT = cat;

    var COLS = [['hotels','Hotels'],['golf','Golf'],['restaurants','Restaurants'],['total','Total']];

    function paint(){
      var board = q('ppBoard');
      if (!DATA || !DATA.length){
        board.innerHTML = '<div class="pp-empty">No check-ins yet. Be the first &mdash; tap &ldquo;I&rsquo;ve been&rdquo; on the <a href="/hotels/">hotels</a>, <a href="/golf/">golf</a> or <a href="/restaurants/">restaurants</a> lists.</div>';
        return;
      }
      // Sort by the active column (desc), then total, then name — and re-rank.
      var rows = DATA.slice().sort(function(a,b){
        return (b[SORT]-a[SORT]) || (b.total-a.total) || String(a.name).localeCompare(String(b.name));
      });
      var head = '<tr><th class="c-rank"></th><th class="c-name">Name</th>' +
        COLS.map(function(c){
          var isTot = c[0]==='total';
          return '<th class="c-num'+(SORT===c[0]?' act':'')+(isTot?' c-total-h':'')+'" data-k="'+c[0]+'">'+c[1]+'<span class="car">&#9662;</span></th>';
        }).join('') + '</tr>';
      var body = rows.map(function(r,i){
        function cell(k){ var v=r[k]||0; var cls='c-num'+(v?'':' zero')+(SORT===k?' act':'')+(k==='total'?' c-total':''); return '<td class="'+cls+'">'+v+'</td>'; }
        return '<tr class="'+(r.is_me?'me':'')+'">'+
          '<td class="c-rank">'+(i+1)+'</td>'+
          '<td class="c-name">'+esc(r.name)+(r.is_me?' <em>you</em>':'')+'</td>'+
          cell('hotels')+cell('golf')+cell('restaurants')+cell('total')+'</tr>';
      }).join('');
      board.innerHTML = '<table class="pp-table"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
      // Header cells are sortable too (Total included).
      [].forEach.call(board.querySelectorAll('th.c-num'), function(th){
        th.addEventListener('click', function(){ setSort(th.getAttribute('data-k')); });
      });
    }

    function syncTabs(){
      [].forEach.call(q('ppTabs').querySelectorAll('.tab-btn'), function(b){
        b.classList.toggle('on', b.getAttribute('data-k') === SORT);
      });
    }
    function setSort(k){
      // Clicking the active category button returns to the default Total sort.
      SORT = (SORT === k && k !== 'total') ? 'total' : k;
      syncTabs(); paint();
    }

    [].forEach.call(q('ppTabs').querySelectorAll('.tab-btn'), function(b){
      b.addEventListener('click', function(){ setSort(b.getAttribute('data-k')); });
    });

    function load(){
      var u = WORKER + '/leaderboard?scope=overall&limit=100';
      if (MEMBER_ID) u += '&me=' + encodeURIComponent(MEMBER_ID);
      fetch(u, { cache:'no-store' }).then(function(r){ return r.ok?r.json():null; }).then(function(d){
        DATA = (d && d.rows) || [];
        syncTabs(); paint();
      }).catch(function(){ q('ppBoard').innerHTML = '<div class="pp-empty">Could not load the leaderboard.</div>'; });
    }

    // Resolve the member (for the "you" row); the board loads either way.
    var tries = 0;
    (function pollMember(){
      var ms = window.$memberstackDom;
      if (ms && ms.getCurrentMember){
        ms.getCurrentMember().then(function(r){
          var m = r && r.data; if (m && m.id){ MEMBER_ID = m.id; load(); }
        }).catch(function(){});
        return;
      }
      if (tries++ < 20) setTimeout(pollMember, 300);
    })();

    syncTabs();
    load();

    // Hero slideshow — crossfade through the golf / hotels / restaurants heroes.
    (function () {
      var imgs = document.querySelectorAll('.rh-img img');
      if (imgs.length < 2) return;
      var i = 0;
      setInterval(function () {
        imgs[i].classList.remove('on');
        i = (i + 1) % imgs.length;
        imgs[i].classList.add('on');
      }, 5000);
    })();
  })();
  </script>
</body>
</html>
