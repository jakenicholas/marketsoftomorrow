    // ── Master search — one typeahead over markets, firms, and projects. ──
    // Markets apply the calculator's in-page filter; firms/projects navigate
    // to their pages. Firm + project indexes lazy-load on first focus via the
    // shared JSON memo (same URLs journal-dock uses, so the fetch is free when
    // the dock already loaded them).
    let _msIdx = null, _msIdxP = null;
    function buildMasterIndex() {
      if (_msIdxP) return _msIdxP;
      const items = [];
      (atlasData.available_states || []).forEach(st => items.push({ name: st.label, kind: 'Market', n: 500, act: 'st:' + st.code }));
      const cityC = {};
      (atlasData.projects || []).forEach(p => { if (p.ci) cityC[p.ci] = (cityC[p.ci] || 0) + 1; });
      Object.keys(cityC).filter(c => cityC[c] >= 2).forEach(c => items.push({ name: c, kind: 'Market', n: cityC[c], act: 'ci:' + c }));
      const j = (u) => (window.__tmwSharedJson ? window.__tmwSharedJson(u)
        : fetch(u, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null));
      _msIdxP = Promise.all([j(MAP_ORIGIN + '/firms-flat.json'), j(MAP_ORIGIN + '/projects-flat.json')]).then(([ff, pf]) => {
        const seen = {};
        if (ff) {
          (ff.architects || []).forEach(f => { if (f.project_count > 0 && !seen['/firm/' + f.slug + '/']) { seen['/firm/' + f.slug + '/'] = 1; items.push({ name: f.name, kind: 'Design', n: f.project_count, url: '/firm/' + f.slug + '/' }); } });
          (ff.developers || []).forEach(f => { if (f.project_count > 0 && !seen['/firm/' + f.slug + '/']) { seen['/firm/' + f.slug + '/'] = 1; items.push({ name: f.name, kind: 'Developer', n: f.project_count, url: '/firm/' + f.slug + '/' }); } });
        }
        if (Array.isArray(pf)) pf.forEach(p => { if (p.Slug && p.Title) items.push({ name: p.Title, kind: 'Project', n: 0, url: '/projects/' + p.Slug + '/' }); });
        _msIdx = items;
        return items;
      });
      return _msIdxP;
    }
    function wireMasterSearch() {
      const input = document.getElementById('acs-input');
      const box = document.getElementById('acs-sug');
      if (!input || !box) return;
      let cur = [], sel = -1;
      const escT = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      function render() {
        if (!cur.length) { box.classList.remove('show'); box.innerHTML = ''; sel = -1; return; }
        box.innerHTML = cur.map((it, i) =>
          '<a href="' + escT(it.url || '#') + '" data-i="' + i + '"' + (i === sel ? ' class="sel"' : '') + '>'
          + '<span>' + escT(it.name) + '</span><span class="k">' + escT(it.kind + (it.n ? ' · ' + it.n : '')) + '</span></a>').join('');
        box.classList.add('show');
      }
      function goItem(it) {
        if (!it) return;
        if (it.act) {
          const place = document.getElementById('ac-place');
          if (place) place.value = it.act;
          input.value = ''; cur = []; render();
          if (it.act.indexOf('ci:') === 0) { atlasAddMarket(it.act.slice(3)); return; }
          if (window.atlasApplyCalc) window.atlasApplyCalc();
          return;
        }
        if (it.url) location.href = it.url;
      }
      function update() {
        const q = input.value.trim().toLowerCase();
        if (q.length < 2 || !_msIdx) { cur = []; render(); return; }
        cur = _msIdx.map(it => {
            const n = it.name.toLowerCase(), i = n.indexOf(q);
            if (i < 0) return null;
            const m = i === 0 ? 3 : (n.charAt(i - 1) === ' ' ? 2 : 1);
            return { it, s: m * 1000 + Math.min(it.n || 0, 999) };
          }).filter(Boolean)
          .sort((a, b) => b.s - a.s)
          .slice(0, 8).map(x => x.it);
        sel = -1; render();
      }
      input.addEventListener('focus', () => { buildMasterIndex().then(() => { if (input.value.trim().length >= 2) update(); }); });
      input.addEventListener('input', update);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { if (cur.length) { e.preventDefault(); sel = (sel + 1) % cur.length; render(); } }
        else if (e.key === 'ArrowUp') { if (cur.length) { e.preventDefault(); sel = (sel - 1 + cur.length) % cur.length; render(); } }
        else if (e.key === 'Enter') { if (cur.length) { e.preventDefault(); goItem(cur[sel < 0 ? 0 : sel]); } }
        else if (e.key === 'Escape') { cur = []; render(); input.blur(); }
      });
      box.addEventListener('mousedown', (e) => {
        const a = e.target && e.target.closest ? e.target.closest('a') : null;
        if (a) { e.preventDefault(); goItem(cur[+a.getAttribute('data-i')]); }
      });
      document.addEventListener('click', (e) => {
        if (!(e.target && e.target.closest && e.target.closest('.mc-search'))) { cur = []; render(); }
      });
    }

    // ── Data loading ────────────────────────────────────────────────────
    function loadAtlasData() {
      if (atlasLoaded) return Promise.resolve(atlasData);
      // Absolute URL — this page is on www.oftmw.com; atlas.json is served
      // from map.oftmw.com (CORS: access-control-allow-origin: *).
      return fetch(`${MAP_ORIGIN}/atlas.json`, { cache: 'no-cache' })
        .then(r => {
          if (!r.ok) throw new Error('atlas.json fetch failed: ' + r.status);
          return r.json();
        })
        .then(data => {
          atlasData = data;
          atlasLoaded = true;
          return data;
        })
        .catch(err => {
          console.warn('[Atlas] Could not load atlas.json:', err);
          const root = document.getElementById('atlasRoot');
          if (root) {
            root.innerHTML = '<div class="atlas-error">Could not load Atlas data. Please try again later.</div>';
          }
          throw err;
        });
    }

    // Build window.allProjectFeatures from projects-flat.json, mapping each
    // flat (PascalCase) record into the {properties:{...camelCase}} shape the
    // map's render code expects — mirrors the map's initializeData() mapping
    // (architects/developers zipped name+slug arrays, boolean featured, etc.).
    let _projectsLoaded = false;
    let _projectsPromise = null;
    function ensureProjectsLoaded() {
      if (_projectsLoaded) return Promise.resolve(window.allProjectFeatures);
      if (_projectsPromise) return _projectsPromise;
      _projectsPromise = fetch(`${MAP_ORIGIN}/projects-flat.json`, { cache: 'no-store' })
        .then(r => {
          if (!r.ok) throw new Error('projects-flat.json fetch failed: ' + r.status);
          return r.json();
        })
        .then(jsonRows => {
          const rows = Array.isArray(jsonRows) ? jsonRows : [];
          const features = rows.map(p => {
            const types = p.ProjectType
              ? p.ProjectType.split(',').map(t => t.trim().toLowerCase()).filter(Boolean)
              : [];
            return {
              type: 'Feature',
              geometry: { type: 'Point', coordinates: [+p.Longitude, +p.Latitude] },
              properties: {
                title: p.Title, city: p.City, description: p.Description,
                delivery: p.Delivery, image: p.ImageURL, website: p.OfficialWebsite,
                projectType: p.ProjectType,
                preferredType: (p.PreferredType || '').trim(),
                projectTypesStr: types.join(','),
                developer: p.Developer || '',
                architect: p.Architect || '',
                architects: (function () {
                  const names = (p.Architect || '').split(',').map(s => s.trim()).filter(Boolean);
                  const slugs = (p.ArchitectSlugs || '').split(',').map(s => s.trim()).filter(Boolean);
                  return names.map((name, i) => ({ name, slug: slugs[i] || '' }));
                })(),
                developers: (function () {
                  const names = (p.Developer || '').split(',').map(s => s.trim()).filter(Boolean);
                  const slugs = (p.DeveloperSlugs || '').split(',').map(s => s.trim()).filter(Boolean);
                  return names.map((name, i) => ({ name, slug: slugs[i] || '' }));
                })(),
                deliveryDate: p.DeliveryDate || '',
                // Parent-district linkage (empty for standalone projects).
                // Needed by pcardHtml's chip lookup so child components on
                // /atlas/ surface their "Part of <District>" pill.
                parentSlug: p.ParentSlug || '',
                keys: p.Keys || '',
                units: p.Units || '',
                floors: p.Floors || '',
                configSummary: p.ConfigSummary || '',
                deliveryPhases: p.DeliveryPhases || '',
                startSpeculative:    (p.StartSpeculative === '1' || p.StartSpeculative === true),
                deliverySpeculative: (p.DeliverySpeculative === '1' || p.DeliverySpeculative === true),
                datesSpeculative:    (p.DatesSpeculative === '1' || p.DatesSpeculative === true
                                     || p.StartSpeculative === '1' || p.DeliverySpeculative === '1'),
                startDate: p.StartDate || '',
                descriptionLong: p.DescriptionLong || '',
                featured: (p.Featured || '').trim().toLowerCase() === 'featured'
              },
              _projectTypes: types
            };
          });
          window.allProjectFeatures = features;
          _projectsLoaded = true;
          return features;
        })
        .catch(err => {
          console.warn('[Atlas] Could not load projects-flat.json:', err);
          window.allProjectFeatures = window.allProjectFeatures || [];
          _projectsLoaded = true;   // don't retry-storm; timeline degrades to empty state
          return window.allProjectFeatures;
        });
      return _projectsPromise;
    }

    // ── Boot ─────────────────────────────────────────────────────────────
    // Allow deep-linking the timeline via ?view=timeline (anything else,
    // including no param, defaults to the instant-rendering Overview).
    // Legacy deep-links: ?view=timeline and ?aview=timeline both meant the
    // pipeline before it became a route. Resolve them to the route.
    (function readInitialView() {
      try {
        const params = new URLSearchParams(window.location.search);
        const v = params.get('view') || params.get('aview');
        if (v === 'timeline' || v === 'pipeline') currentRoute = 'pipeline';
      } catch (_) {}
      syncViewFromRoute();
    })();

    function init() {
      loadAtlasData().then(() => {
        if (!atlasData) return;
        renderAll();  // instant data panels (timeline hero / overview cards show a loading state)
        // Both views need the project list — the Overview for its card grid,
        // the timeline for its rows. Fetch once, then re-render to fill them in.
        if (!(window.allProjectFeatures && window.allProjectFeatures.length)) {
          ensureProjectsLoaded().then(() => { if (atlasData) renderAll(); });
        }
      }).catch(() => {});
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
    // The journal-chrome header injects asynchronously — re-measure once it lands.
    window.addEventListener('load', syncHeadOffset);
    setTimeout(syncHeadOffset, 300);
    setTimeout(syncHeadOffset, 1000);

    // Re-render leaderboard if viewport crosses the mobile/desktop boundary
    let lastMobile = isMobileNow();
    window.addEventListener('resize', function() {
      syncHeadOffset();
      const m = isMobileNow();
      if (m !== lastMobile) {
        lastMobile = m;
        if (atlasData && currentAtlasView === 'stats') {
          const activeTab = document.querySelector('.atlas-lb-tab.active');
          const key = activeTab ? activeTab.dataset.lbTab : 'developers';
          const content = document.getElementById('atlasLbContent');
          if (content) content.innerHTML = renderLeaderboardRows(key);
          updateLoadMoreBtn(key);
        }
      }
    });
  })();
  </script>

  <!-- ───────────────────────────────────────────────────────────────────
       ATLAS PAYWALL GATE — the Atlas is a Pro feature. Non-Pro visitors (anon +
       free) get a ~5-second glance, then a HARD (non-dismissible) paywall pushing
       the free 2-week trial. Paid members are never gated (via journal-auth).
       ─────────────────────────────────────────────────────────────────── -->
  <script>
  (function () {
    function isPro() {
      try {
        if (window._isPaidMember) return true;
        if (window.tmwAuth && window.tmwAuth.paid) return true;
        if (localStorage.getItem('tmw_auth_state') === 'pro') return true;
      } catch (e) {}
      return false;
    }
    function start() {
      if (isPro()) return;                        // never gate Pro members
      // Atlas is a Pro feature. Non-Pro (anonymous + free) get a ~5s glance, then
      // a HARD, non-dismissible paywall pushing the free 2-week trial.
      setTimeout(function () {
        if (isPro()) return;                      // re-check — they may have upgraded / auth flipped
        if (typeof window.tmwShowPaywall === 'function') window.tmwShowPaywall('atlas', { hard: true });
      }, 5000);
    }
    // Decide only once auth is actually RESOLVED (tmwAuth.ready), not merely when
    // _isPaidMember is defined — it's pre-set to false before Memberstack resolves,
    // which was briefly gating Pro members. Cached pro state short-circuits.
    function ready(cb) {
      if (isPro() || (window.tmwAuth && window.tmwAuth.ready)) return cb();
      var n = 0, t = setInterval(function () {
        if ((window.tmwAuth && window.tmwAuth.ready) || isPro() || ++n > 50) { clearInterval(t); cb(); }
      }, 100);
    }
    function boot() { ready(start); }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  })();
  </script>
</body>
