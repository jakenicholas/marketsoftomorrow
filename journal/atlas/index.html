    function renderCoverageAndComing() {
      // "Most covered on Tomorrow" (TMW coverage) section removed per request;
      // Coming Soon now renders full-width on its own.
      return renderComingSoon();
    }

    // The "Atlas · part of Markets of Tomorrow · data updated …" credit line is
    // retired: the universal footer already says whose site this is, and the
    // line left a band of empty space under every route.
    function renderFooter() { return ''; }

    // Build a city → state lookup from atlas data.
    function buildCityStateMap() {
      if (!atlasData) return {};
      if (atlasData.city_state_map && typeof atlasData.city_state_map === 'object') {
        return atlasData.city_state_map;
      }
      const out = {};
      const byState = atlasData.leaderboards_by_state || {};
      Object.entries(byState).forEach(([state, lb]) => {
        (lb && lb.cities || []).forEach(c => {
          if (c && c.name && !(c.name in out)) out[c.name] = state;
        });
      });
      (atlasData.leaderboards && atlasData.leaderboards.cities || []).forEach(c => {
        if (c && c.name && !(c.name in out) && c.states && c.states.length) {
          out[c.name] = c.states[0];
        }
      });
      return out;
    }

    // ── View tabs renderer — Overview vs Pipeline switcher

    // ── ROUTER ───────────────────────────────────────────────────────────
    // The Atlas is an app, not one long page. Each route renders its own
    // sections; the rail below the view tabs is the nav. renderAll() was
    // already an array of section functions, so a route is just a different
    // slice of that array.
    //
    // URLs are real paths (/atlas/projects/) via a Pages 200-rewrite, so every
    // view is linkable and the back button works. The shared filter query
    // string (city/state/type/status/year) rides along untouched, which is
    // what makes moving between routes feel like one product.
    // Order follows how the data is actually browsed: where (markets), what
    // (projects), who (firms), then the analytical cuts.
    const ATLAS_ROUTES = [
      { id: 'overview', label: 'Overview' },
      { id: 'markets',  label: 'Markets'  },
      { id: 'projects', label: 'Projects' },
      { id: 'firms',    label: 'Firms'    },
      { id: 'supply',   label: 'Supply'   },
      { id: 'pricing',  label: 'Pricing'  },
      { id: 'capital',  label: 'Capital'  },
      // Pipeline used to be a separate view behind its own Overview/Pipeline
      // toggle above the tabs. It is just another route.
      { id: 'pipeline', label: 'Pipeline' }
    ];
    // Retired tabs that must still resolve: 'builders' folded into Firms (the
    // leaderboard now heads that route) and 'movers' lost its tab but keeps
    // its module on Overview. Old links and bookmarks land somewhere sane.
    const ATLAS_ROUTE_ALIAS = { builders: 'firms', movers: 'overview' };
    const ATLAS_ROUTE_IDS = ATLAS_ROUTES.map(r => r.id);

    // A route can arrive two ways and BOTH are first-class:
    //   /atlas/projects/        the pretty path (served by functions/atlas/[route].js)
    //   /atlas/?view=projects   the query form
    // The path form depends on a Pages Function; the query form depends on
    // nothing. Accepting both means a routing-layer failure degrades to a
    // working app instead of a 404, and it costs one extra branch.
    function routeFromPath() {
      const m = String(location.pathname || '').match(/\/atlas\/([a-z-]+)\/?$/);
      let id = m ? m[1] : '';
      if (ATLAS_ROUTE_IDS.indexOf(id) < 0 && !ATLAS_ROUTE_ALIAS[id]) {
        try { id = new URLSearchParams(location.search).get('view') || ''; } catch (e) { id = ''; }
      }
      if (ATLAS_ROUTE_ALIAS[id]) id = ATLAS_ROUTE_ALIAS[id];
      return ATLAS_ROUTE_IDS.indexOf(id) >= 0 ? id : 'overview';
    }
    let currentRoute = routeFromPath();
    // currentAtlasView is still read in a few places (timeline scroll anchor,
    // resize re-render, project prefetch). Keep it derived from the route
    // rather than leaving two sources of truth for the same thing.
    function syncViewFromRoute() {
      currentAtlasView = (currentRoute === 'pipeline') ? 'timeline' : 'stats';
    }
    // Prefer the pretty path. The ONLY signal that it is unavailable is the
    // reader having arrived on ?view= — either because a link was generated
    // that way, or because the Function did not serve the path. Testing
    // "am I on a route path" instead was wrong: on /atlas/ itself that is
    // false, which made the app root emit ?view= links even though paths work.
    const _pathRoutingWorks = (function () {
      try { return !new URLSearchParams(location.search).get('view'); } catch (e) { return true; }
    })();

    function routeHref(id) {
      const q = new URLSearchParams(location.search || '');
      q.delete('view');
      if (_pathRoutingWorks) {
        const qs = q.toString();
        return (id === 'overview' ? '/atlas/' : '/atlas/' + id + '/') + (qs ? '?' + qs : '');
      }
      if (id !== 'overview') q.set('view', id);
      const qs = q.toString();
      return '/atlas/' + (qs ? '?' + qs : '');
    }

    function renderSectionRail() {
      return '<nav class="atlas-rail" aria-label="Sections">'
        + ATLAS_ROUTES.map(function (r) {
            return '<a class="atlas-rail-jump' + (r.id === currentRoute ? ' on' : '') + '"'
              + ' href="' + routeHref(r.id) + '" data-route="' + r.id + '"'
              + (r.id === currentRoute ? ' aria-current="page"' : '') + '>' + r.label + '</a>';
          }).join('')
        + '</nav>';
    }

    function goRoute(id, push) {
      if (ATLAS_ROUTE_IDS.indexOf(id) < 0) id = 'overview';
      if (id === currentRoute) return;
      currentRoute = id;
      // Route changes ARE navigation (unlike filter changes), so pushState.
      if (push !== false) { try { history.pushState({ atlasRoute: id }, '', routeHref(id)); } catch (e) {} }
      _pcardShown = PCARD_STEP;
      _atlasTlScrolledOnce = false;
      renderAll();
      // Pipeline needs the project list. The retired Overview/Pipeline toggle
      // used to kick this fetch; the route has to do it now or the timeline
      // sits on its loading placeholder forever.
      if (id === 'pipeline' && !(window.allProjectFeatures && window.allProjectFeatures.length)) {
        try {
          ensureProjectsLoaded().then(function () { if (currentRoute === 'pipeline') renderAll(); });
        } catch (e) {}
        return;
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    // Delegated so it survives every re-render without re-binding.
    document.addEventListener('click', function (e) {
      const a = e.target && e.target.closest ? e.target.closest('.atlas-rail-jump[data-route]') : null;
      if (!a) return;
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button > 0) return;  // let new-tab work
      e.preventDefault();
      goRoute(a.getAttribute('data-route'), true);
    });
    window.addEventListener('popstate', function () {
      const id = routeFromPath();
      if (id !== currentRoute) { currentRoute = id; _pcardShown = PCARD_STEP; renderAll(); }
    });

    // ── Pipeline timeline section — reads window.allProjectFeatures (built
    //    from projects-flat.json, see ensureProjectsLoaded). Each row links to
    //    the project page on map.oftmw.com.
    function renderTimelineSection() {
      const features = window.allProjectFeatures || [];
      if (!features.length) {
        return `
          <section class="atlas-section">
            <div class="atlas-tl-hero">
              <h2>What's opening next.</h2>
              <p>Every project in the TMW pipeline, ordered by delivery date.</p>
            </div>
            <div class="atlas-tl-empty">Pipeline still loading&hellip;</div>
          </section>`;
      }

      const cityToState = buildCityStateMap();
      const stateFilter = (currentStateFilter && currentStateFilter !== 'ALL') ? currentStateFilter : null;
      const typeFilter = (currentTypeFilter && currentTypeFilter !== 'ALL') ? currentTypeFilter : null;
      const cityFilter = (currentCityFilter && currentCityFilter !== 'ALL') ? currentCityFilter : null;
      const yearFilter = currentYearFilter ? parseInt(currentYearFilter, 10) : null;

      const STATUS_INFO = {
        'announced':       { label: 'Announced',       color: '#9CA3AF' },
        'breaking-ground': { label: 'Breaking Ground', color: '#FFD300' },
        'construction':    { label: 'Construction',    color: '#FF9500' },
        'coming-soon':     { label: 'Coming Soon',     color: '#4DABFF' },
        'open':            { label: 'Now Open',        color: '#1FDF67' },
      };
      const STATUS_FILTERS = [
        { id: 'all',              label: 'All' },
        { id: 'breaking-ground',  label: 'Breaking ground', color: '#FFD300' },
        { id: 'construction',     label: 'Construction',    color: '#FF9500' },
        { id: 'coming-soon',      label: 'Coming soon',     color: '#4DABFF' },
        { id: 'open',             label: 'Now open',        color: '#1FDF67' },
      ];
      function normStatus(raw) {
        const s = (raw || '').toString().toLowerCase();
        if (s.includes('now open') || s === 'open' || s.includes('complete')) return 'open';
        if (s.includes('opening') || s.includes('coming')) return 'coming-soon';
        if (s.includes('construction')) return 'construction';
        if (s.includes('breaking')) return 'breaking-ground';
        return 'announced';
      }
      function pyStyleSlugLocal(text) {
        return (text || '').toLowerCase()
          .replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-').replace(/^-|-$/g, '');
      }
      function escapeAttr(s) {
        return (s == null ? '' : String(s))
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      }
      function fmtMonthYear(s) {
        if (!s) return '—';
        const m = String(s).match(/^(\d{4})(?:-(\d{2}))?/);
        if (!m) return s;
        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return m[2] ? `${MONTHS[+m[2]-1] || m[2]} ${m[1]}` : m[1];
      }
      function fmtNum(n) {
        if (n == null || n === '') return null;
        const v = parseInt(n, 10);
        return isNaN(v) ? null : v.toLocaleString();
      }

      const allBase = features.map(f => f.properties).filter(p => {
        if (!p.deliveryDate) return false;
        if (stateFilter) {
          const projectState = cityToState[p.city] || 'Other';
          if (projectState !== stateFilter) return false;
        }
        if (typeFilter) {
          const pty = ((p.projectType || '').split(',')[0] || '').trim();
          if (pty !== typeFilter) return false;
        }
        if (cityFilter && p.city !== cityFilter) return false;
        if (yearFilter) {
          const dy = parseInt(String(p.deliveryDate || '').slice(0, 4), 10);
          if (!dy || dy > yearFilter) return false;
        }
        if (currentTimelineFeatured && !p.featured) return false;
        return true;
      });

      const _now = new Date();
      const todayPivot = new Date(_now.getFullYear(), _now.getMonth(), 1);
      function deliveryAsDate(p) {
        const m = (p.deliveryDate || '').match(/^(\d{4})(?:-(\d{2}))?/);
        if (!m) return null;
        const year = +m[1];
        const month = m[2] ? +m[2] - 1 : 11;
        return new Date(year, month, 1);
      }

      // Classify by STATUS first: an already-open project belongs in the
      // "recently opened" archive, never in the upcoming pipeline. Splitting by
      // delivery date alone put a current-month opening (e.g. a July 1 opening
      // viewed on July 13) into the FUTURE pipeline still flagged "Now Open".
      // Only not-yet-open projects split by delivery date vs the current month.
      const isOpenNow = (p) => normStatus(p.delivery) === 'open';
      const pipelineBase  = allBase.filter(p => { if (isOpenNow(p)) return false; const d = deliveryAsDate(p); return d && d >= todayPivot; });
      const completedBase = allBase.filter(p => { if (isOpenNow(p)) return true;  const d = deliveryAsDate(p); return d && d <  todayPivot; });

      const statusFilter = currentTimelineStatus;
      const showCompleted = (statusFilter === 'all' || statusFilter === 'open');
      const showPipeline  = (statusFilter !== 'open');
      const pipelineShown = showPipeline
        ? pipelineBase.filter(p => statusFilter === 'all' || normStatus(p.delivery) === statusFilter)
        : [];
      const completedShown = showCompleted
        ? completedBase.filter(p => statusFilter === 'all' || normStatus(p.delivery) === statusFilter)
        : [];

      const filtered = (statusFilter === 'open') ? completedShown : pipelineShown;

      const totalCount = filtered.length;
      const totalUnits = filtered.reduce((s, p) => s + (parseInt(p.units, 10) || 0), 0);
      const totalKeys  = filtered.reduce((s, p) => s + (parseInt(p.keys, 10)  || 0), 0);
      const now = new Date();
      const cutoff = new Date(now.getFullYear(), now.getMonth() + 12, 1);
      let next12 = 0;
      for (const p of filtered) {
        const m = (p.deliveryDate || '').match(/^(\d{4})(?:-(\d{2}))?/);
        if (!m) continue;
        const d = new Date(+m[1], (m[2] ? +m[2] - 1 : 11), 1);
        if (d <= cutoff) next12++;
      }

      const heroHtml = `
        <div class="atlas-tl-hero">
          <h2>What's opening next.</h2>
          <p>Every project in the TMW pipeline, ordered by delivery date. Scroll forward through the calendar — see what's about to land in your market.</p>
          <div class="atlas-tl-hero-stats">
            <div class="atlas-tl-hero-stat"><span class="val accent">${totalCount}</span><span class="lbl">In pipeline</span></div>
            <div class="atlas-tl-hero-stat"><span class="val">${fmtNum(totalUnits) || '—'}</span><span class="lbl">Residential units</span></div>
            <div class="atlas-tl-hero-stat"><span class="val">${fmtNum(totalKeys) || '—'}</span><span class="lbl">Hotel keys</span></div>
            <div class="atlas-tl-hero-stat"><span class="val">${next12}</span><span class="lbl">Open in next 12 mo</span></div>
          </div>
        </div>`;

      const statusChipsHtml = STATUS_FILTERS.map(s => `
        <button class="atlas-tl-chip ${currentTimelineStatus === s.id ? 'active' : ''}" data-tl-status="${s.id}" type="button">
          ${s.color ? `<span class="swatch" style="background:${s.color}"></span>` : ''}${s.label}
        </button>
      `).join('');
      const featuredChipsHtml = `
        <button class="atlas-tl-chip ${!currentTimelineFeatured ? 'active' : ''}" data-tl-featured="all" type="button">All projects</button>
        <button class="atlas-tl-chip ${currentTimelineFeatured  ? 'active' : ''}" data-tl-featured="featured" type="button"><span style="color:#FFD300">&#9733;</span> Featured only</button>
      `;
      const totalAvailable = allBase.length;
      const filtersHtml = `
        <div class="atlas-tl-filters">
          <div class="atlas-tl-filter-group">${statusChipsHtml}</div>
          <div class="atlas-tl-filter-group">${featuredChipsHtml}</div>
          <span class="atlas-tl-meta-count">${totalCount} of ${totalAvailable}</span>
        </div>`;

      if (!pipelineShown.length && !completedShown.length) {
        const stateNote = stateFilter
          ? `No matching projects in <b>${escapeAttr(stateFilter)}</b>. Try a different state or filter.`
          : `No projects match the current filters.`;
        return `
          <section class="atlas-section">
            ${heroHtml}
            ${filtersHtml}
            <div class="atlas-tl-empty">${stateNote}</div>
          </section>`;
      }

      function buildGroups(items) {
        const groups = new Map();
        for (const p of items) {
          const m = (p.deliveryDate || '').match(/^(\d{4})(?:-(\d{2}))?/);
          if (!m) continue;
          const year = +m[1];
          const month = m[2] ? +m[2] : 12;
          const quarter = Math.ceil(month / 3);
          const key = `${year}-${quarter}`;
          if (!groups.has(key)) groups.set(key, { year, quarter, items: [] });
          groups.get(key).items.push(p);
        }
        return groups;
      }
      function rowHtml(p, isCompleted) {
        const status = normStatus(p.delivery);
        const info = STATUS_INFO[status] || STATUS_INFO.announced;
        const imgHtml = p.image
          ? `<img class="atlas-tl-row-img-photo" src="${escapeAttr(p.image)}" alt="" loading="lazy" decoding="async" />`
          : '';
        const type = p.preferredType || ((p.projectType || '').split(',')[0] || '').trim();
          const metaParts = [];
          if (p.city) metaParts.push(`<span>${escapeAttr(p.city)}</span>`);
          if (type)  metaParts.push(`<span class="sep">·</span><span>${escapeAttr(type)}</span>`);
          const firstFirm = (p.architects && p.architects[0] && p.architects[0].name)
            || (p.developers && p.developers[0] && p.developers[0].name)
            || '';
          if (firstFirm) {
            metaParts.push(`<span class="sep">&middot;</span><span>${escapeAttr(firstFirm)}</span>`);
          }
          const cfgChip = (() => {
            const s = (p.configSummary || '').trim();
            if (!s) return '';
            const SPELL = { two:2, three:3, four:4, five:5, six:6, seven:7, eight:8 };
            let m = s.match(/\b(\d+)[\s-]?(tower|building)s?\b/i);
            if (!m) {
              m = s.match(/\b(two|three|four|five|six|seven|eight)[\s-]?(tower|building)s?\b/i);
              if (m) m = [m[0], String(SPELL[m[1].toLowerCase()]), m[2]];
            }
            if (m) {
              const n = parseInt(m[1], 10);
              const noun = m[2].toLowerCase() === 'building' ? 'buildings' : 'towers';
              return `<span class="sep">&middot;</span><span class="atlas-tl-row-chip">${n} ${noun}</span>`;
            }
            if (/\b(tower|building)s?\b/i.test(s)) {
              return `<span class="sep">&middot;</span><span class="atlas-tl-row-chip">Multi-tower</span>`;
            }
            return '';
          })();
          if (cfgChip) metaParts.push(cfgChip);
          const phsChip = (() => {
            const s = (p.deliveryPhases || '').trim();
            if (!s) return '';
            const phaseMatches = s.match(/\bphase\s+\d+\b/gi);
            if (phaseMatches && phaseMatches.length >= 2) {
              return `<span class="sep">&middot;</span><span class="atlas-tl-row-chip warn">${phaseMatches.length} phases</span>`;
            }
            const dotParts = s.split(/\s+·\s+/).filter(Boolean);
            if (dotParts.length >= 2) {
              return `<span class="sep">&middot;</span><span class="atlas-tl-row-chip warn">${dotParts.length} phases</span>`;
            }
            return `<span class="sep">&middot;</span><span class="atlas-tl-row-chip warn">Phased</span>`;
          })();
          if (phsChip) metaParts.push(phsChip);
          if (p.datesSpeculative) {
            metaParts.push(`<span class="sep">&middot;</span><span class="atlas-tl-row-chip est">EST date</span>`);
          }
        const scaleParts = [];
        if (p.keys)   scaleParts.push(`<div class="stat"><b>${fmtNum(p.keys)}</b>keys</div>`);
        if (p.units)  scaleParts.push(`<div class="stat"><b>${fmtNum(p.units)}</b>units</div>`);
        if (p.floors) scaleParts.push(`<div class="stat"><b>${escapeAttr(p.floors)}</b>floors</div>`);
        const slug = pyStyleSlugLocal(p.title || '');
        const rowClass = 'atlas-tl-row atlas-tl-item' + (isCompleted ? ' atlas-tl-row--completed' : '');
        const projHref = slug ? `${MAP_ORIGIN}/projects/${encodeURIComponent(slug)}/` : '#';
        // Wrap the whole grid row in an anchor (display:contents) so the row
        // navigates to the project page on map.oftmw.com instead of relying on
        // the map's in-app click handler.
        return `
          <a class="atlas-tl-row-link" href="${escapeAttr(projHref)}">
          <div class="${rowClass}" data-project-slug="${escapeAttr(slug)}">
            <div class="atlas-tl-row-date">${escapeAttr(fmtMonthYear(p.deliveryDate))}</div>
            <div class="atlas-tl-row-dot-slot"></div>
            <div class="atlas-tl-row-card">
              <div class="atlas-tl-row-img">
                ${imgHtml}
                ${p.featured ? '<div class="atlas-tl-row-featured" title="Featured">&#9733;</div>' : ''}
                <div class="atlas-tl-row-status"><span class="dot" style="background:${info.color}"></span>${escapeAttr(info.label)}</div>
              </div>
              <div class="atlas-tl-row-body">
                <div class="atlas-tl-row-title">${escapeAttr(p.title || '')}</div>
                <div class="atlas-tl-row-meta">${metaParts.join('')}</div>
                ${scaleParts.length ? `<div class="atlas-tl-row-scale">${scaleParts.join('')}</div>` : ''}
              </div>
            </div>
          </div>
          </a>`;
      }
      function buildGroupsHtml(items, { isCompleted = false, descending = false } = {}) {
        if (!items.length) return '';
        const groups = buildGroups(items);
        const keys = [...groups.keys()].sort();
        if (descending) keys.reverse();
        const verb = isCompleted ? 'opened' : 'opening';
        return keys.map(k => {
          const g = groups.get(k);
          const sortedItems = g.items.slice().sort((a, b) => {
            const fa = (a.featured ? 1 : 0) - (b.featured ? 1 : 0);
            if (fa !== 0) return -fa;
            const cmp = (a.deliveryDate || '').localeCompare(b.deliveryDate || '');
            return descending ? -cmp : cmp;
          });
          const rowsHtml = sortedItems.map(p => rowHtml(p, isCompleted)).join('');
          const qheadClass = 'atlas-tl-qhead' + (isCompleted ? ' atlas-tl-qhead--completed' : '');
          return `
            <div class="${qheadClass}">
              <div class="atlas-tl-qhead-date">Q${g.quarter}<span class="yr">${g.year}</span></div>
              <div class="atlas-tl-qhead-dot"></div>
              <div class="atlas-tl-qhead-count"><span class="atlas-tl-qhead-date-inline">Q${g.quarter} ${g.year} &middot;</span> <b>${g.items.length}</b> project${g.items.length === 1 ? '' : 's'} ${verb}</div>
            </div>
            ${rowsHtml}`;
        }).join('');
      }
      const completedGroupsHtml = buildGroupsHtml(completedShown, { isCompleted: true, descending: false });
      const pipelineGroupsHtml  = buildGroupsHtml(pipelineShown,  { isCompleted: false });
      const archiveHeaderHtml = completedShown.length ? `
        <div class="atlas-tl-archive-head">
          <div class="atlas-tl-archive-eyebrow">Scroll down for today &darr;</div>
          <div class="atlas-tl-archive-title">Recently opened</div>
          <div class="atlas-tl-archive-sub">${completedShown.length} project${completedShown.length === 1 ? '' : 's'} already delivered &mdash; oldest first, working forward to today.</div>
        </div>` : '';
      const nowBoundaryHtml = (completedShown.length && pipelineShown.length) ? `
        <div class="atlas-tl-now-boundary" id="atlasTlNowBoundary">
          <span class="atlas-tl-now-pill">Today</span>
        </div>` : '';

      return `
        <section class="atlas-section">
          ${heroHtml}
          ${filtersHtml}
          <div class="atlas-tl-list">
            ${archiveHeaderHtml}
            ${completedGroupsHtml}
            ${nowBoundaryHtml}
            ${pipelineGroupsHtml}
          </div>
        </section>`;
    }

    // Follow the Money — a native atlas-section wrapping the shared money module
    // (/_shared/intel-modules.js), filled async after each render.
    function renderMoneySection() {
      return '<section class="atlas-section" id="atlasMoney">'
        + '<div class="atlas-section-head"><div>'
        + '<h2 class="atlas-section-title">Follow the <em>money</em></h2>'
        + '<p class="atlas-section-sub">Every tracked financing — who\'s raising, where it\'s landing, and how much is disclosed.</p>'
        + '</div></div>'
        + '<div data-tmw-money data-mode="full"><div class="tmw-m-loading" style="font:12px \'Inter\',sans-serif;color:#8b958d;padding:14px 2px">Tracing the capital…</div></div>'
        + '</section>';
    }
    // ── Atlas Intelligence · supply pressure (Surface C) ──────────────
    // Reads /map/atlas-intel.json (generate_atlas_intel.py — same scores the
    // market pages bake in). Fetched once, filled into the placeholder section
    // whenever renderAll rebuilds the DOM.
    let supplyIntel = null, supplyIntelP = null;
    // Slugs of markets that actually HAVE a /markets/ page — nothing without
    // a landing page is ever rendered as a clickable tile.
    let marketPageSlugs = null, marketPageSlugsP = null;
    function loadMarketPageSlugs() {
      if (!marketPageSlugsP) {
        marketPageSlugsP = fetch('/markets-index.json', { cache: 'no-cache' })
          .then(r => r.ok ? r.json() : null)
          .then(j => { marketPageSlugs = j ? new Set(Object.values(j)) : new Set(); })
          .catch(() => { marketPageSlugs = new Set(); });
      }
      return marketPageSlugsP;
    }
    function renderSupplySection() { return '<section class="atlas-section" id="atlasSupplySec"></section>'; }
    function loadSupplyIntel() {
      if (supplyIntel) { fillSupplySec(); return; }
      if (!supplyIntelP) {
        supplyIntelP = fetch('/map/atlas-intel.json', { cache: 'no-cache' })
          .then(r => r.ok ? r.json() : null)
          .then(j => {
            supplyIntel = j;
            fillSupplySec();
            try{mountMaster();}catch(e){}
            // intel carries the country per market; regroup the place picker
            // now that regions can resolve properly
            try{var ps=document.getElementById('ac-place');
              if(ps){var pv=ps.value;
                ps.innerHTML='<option value=\"\">Markets</option>'+buildPlaceOptions(pv);
                ps.value=pv;}}catch(e){}
            // fillSupplySec targets #atlasSupplySec and no-ops elsewhere, so the
            // Markets route (which reads the same intel for its pressure column)
            // would never learn the data landed. Re-render it explicitly.
            if (currentRoute === 'markets') renderAll();
          })
          .catch(() => {});
      } else { supplyIntelP.then(() => fillSupplySec()); }
    }
    function miniSupplyGauge(score, color) {
      const len = Math.PI * 26, dash = len * Math.max(score, 2) / 100;
      return `<svg viewBox="0 0 64 38" class="asp-g" aria-hidden="true">`
        + `<path d="M 6 34 A 26 26 0 0 1 58 34" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5" stroke-linecap="round"/>`
        + `<path d="M 6 34 A 26 26 0 0 1 58 34" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${len.toFixed(1)}"/>`
        + `<text x="32" y="30" text-anchor="middle" class="asp-n">${score}</text></svg>`;
    }
    function fillSupplySec() {
      const sec = document.getElementById('atlasSupplySec');
      if (!sec || !supplyIntel || !supplyIntel.markets) return;
      if (!marketPageSlugs) { loadMarketPageSlugs().then(() => fillSupplySec()); return; }
      const COLOR = { Balanced: '#1FDF67', Elevated: '#F5A623', Saturated: '#FF5C5C' };
      const stFilter = (currentStateFilter && currentStateFilter !== 'ALL') ? currentStateFilter : null;
      const ciFilter = (currentCityFilter && currentCityFilter !== 'ALL') ? currentCityFilter : null;
      const pool = Object.entries(supplyIntel.markets)
        .map(([slug, m]) => [slug, m])
        .filter(([slug]) => marketPageSlugs.has(slug))
        .filter(([, m]) => m.pipeline_projects >= ((stFilter || ciFilter) ? 2 : 4))
        .sort((a, b) => b[1].score - a[1].score);
      let tops;
      if (atlasMarkets.length > 1) {
        tops = pool.filter(([, m]) => atlasMarkets.indexOf(m.city) >= 0).slice(0, 8);
      } else if (ciFilter) {
        const mine = pool.find(([, m]) => m.city === ciFilter);
        const st = mine ? mine[1].state : null;
        tops = pool.filter(([, m]) => m.city === ciFilter || (st && m.state === st)).slice(0, 8);
      } else if (stFilter) {
        tops = pool.filter(([, m]) => m.state === stFilter).slice(0, 8);
      } else {
        // Global default: cap two markets per region so one hot metro
        // doesn't crowd out the world.
        const per = {}; tops = [];
        for (const ent of pool) {
          const r = ent[1].region || ent[1].city;
          if ((per[r] || 0) >= 2) continue;
          per[r] = (per[r] || 0) + 1;
          tops.push(ent);
          if (tops.length >= 8) break;
        }
      }
      if (!tops.length) { sec.remove(); return; }
      const rest = pool.filter(e => tops.indexOf(e) < 0).slice(0, 14);
      const moreChips = rest.map(([slug, m]) => {
        const c = COLOR[m.level] || '#1FDF67';
        return `<a class="asp-chip" href="/markets/${slug}/"><i style="background:${c};box-shadow:0 0 8px ${c}"></i>${m.city} <b style="color:${c}">${m.score}</b></a>`;
      }).join('');
      sec.innerHTML = `
        <div class="atlas-section-head"><div>
          <h2 class="atlas-section-title">Supply <em>pressure</em></h2>
          <p class="atlas-section-sub">New-supply concentration by market over the next 36 months, modeled by Onyx from the delivery pipeline.</p>
        </div></div>
        <div class="atlas-panel">
          <div class="asp-grid">` + tops.map(([slug, m]) => {
            const c = COLOR[m.level] || '#1FDF67';
            return `<a class="asp-card" href="/markets/${slug}/">${miniSupplyGauge(m.score, c)}`
              + `<div class="asp-city">${m.city}</div>`
              + `<div class="asp-lvl" style="color:${c}">${m.level.toUpperCase()}</div>`
              + `<div class="asp-meta">${m.delivering_24mo.projects} projects · ${(m.delivering_24mo.units || 0).toLocaleString()} units next 24 mo</div></a>`;
          }).join('') + `</div>`
          + (moreChips ? `<div class="asp-more"><span class="asp-more-l">More markets</span>${moreChips}</div>` : '')
          + `<div class="asp-foot">Scored 0–100 on near-term delivery density and window concentration · Balanced &lt;40 · Elevated 40–69 · Saturated 70+</div>
        </div>`;
    }

    // ── Atlas Intelligence · Onyx projections (Surface A on the Atlas) ──
    // Shape cards from the public file; Pro members get the modeled PSF per
    // card painted from the worker (server-verified, absent from public data).
    let projShape = null, projShapeP = null;
    let projMarkets = [], projSel = new Set(), projAvg = {}, projMemberId = null, projCompDone = new Set(), projExpanded = new Set();
    function renderProjectionsSection() { return '<section class="atlas-section" id="atlasProjSec"></section>'; }
    function loadProjSec() {
      if (projShape) { fillProjSec(); return; }
      if (!projShapeP) {
        projShapeP = fetch('/map/atlas-projections-public.json', { cache: 'no-cache' })
          .then(r => r.ok ? r.json() : null)
          .then(j => { projShape = j; fillProjSec(); })
          .catch(() => {});
      } else { projShapeP.then(() => fillProjSec()); }
    }
    function fillProjSec() {
      const sec = document.getElementById('atlasProjSec');
      if (!sec || !projShape || !projShape.projects) return;
      let rows = Object.entries(projShape.projects)
        .map(([slug, v]) => Object.assign({ slug }, v))
        .filter(v => v.modeled && v.title)
        .sort((a, b) => (b.confidence === 'high') - (a.confidence === 'high') || (b.comp_count || 0) - (a.comp_count || 0));
      const pStFilter = (currentStateFilter && currentStateFilter !== 'ALL') ? currentStateFilter : null;
      const pCiFilter = (currentCityFilter && currentCityFilter !== 'ALL') ? currentCityFilter : null;
      if (pStFilter || pCiFilter) {
        if (!supplyIntel && supplyIntelP) { supplyIntelP.then(() => fillProjSec()); return; }
        rows = rows.filter(v => {
          if (pCiFilter) return v.city === pCiFilter;
          const mk = supplyIntel && supplyIntel.markets && supplyIntel.markets[v.market];
          return mk && mk.state === pStFilter;
        });
      }
      if (rows.length < ((pStFilter || pCiFilter) ? 1 : 3)) { sec.innerHTML = ''; return; }
      // Group the modeled projects by MARKET, then render a compact comparison chart
      // (avg $/sq ft per market) up top; tapping a market shows its comparable set,
      // tapping several compares them. Keeps the section short until you dig in.
      const tc = s => String(s || '').replace(/\b\w/g, c => c.toUpperCase());
      // Boroughs fold into their parent market (Brooklyn is New York City).
      const MKT_ALIAS = {
        'brooklyn': { market: 'new-york-city', city: 'New York City' },
        'manhattan': { market: 'new-york-city', city: 'New York City' },
        'queens': { market: 'new-york-city', city: 'New York City' },
      };
      const groups = {};
      rows.forEach(v => {
        let key = v.market || (v.city || '').toLowerCase();
        let cityLabel = v.city || tc(key);
        const al = MKT_ALIAS[key];
        if (al) { key = al.market; cityLabel = al.city; }
        if (!groups[key]) groups[key] = { market: key, city: cityLabel, items: [] };
        groups[key].items.push(v);
      });
      projMarkets = Object.values(groups).sort((a, b) => b.items.length - a.items.length);
      // Keep any prior selection valid; default to the largest market on first fill.
      const valid = new Set(projMarkets.map(g => g.market));
      projSel = new Set([...projSel].filter(m => valid.has(m)));
      if (!projSel.size && projMarkets.length) projSel.add(projMarkets[0].market);
      sec.innerHTML = `
        <div class="atlas-section-head"><div>
          <h2 class="atlas-section-title">Onyx <em>projections</em></h2>
          <p class="atlas-section-sub">Average modeled price at delivery by market. Tap a market to see the projects behind it; tap more to compare. Values are a Pro surface.</p>
        </div></div>
        <div class="apj-chart">
          <div class="apj-chart-top">
            <span class="apj-chart-lead" id="apjLead">Average $/sq ft at delivery, by market</span>
            <span><button type="button" class="apj-chart-act" id="apjSelAll">Show all</button><button type="button" class="apj-chart-act" id="apjSelNone">Clear</button></span>
          </div>
          <div id="apjBars"></div>
        </div>
        <div id="apjDetail"></div>
        <div class="asp-foot" style="margin-top:6px">Market averages are the median of each market's modeled projections — transparent comp bases, never listings. Full bands, comps and scenarios live on each project page.</div>`;
      const selAll = document.getElementById('apjSelAll'), selNone = document.getElementById('apjSelNone');
      if (selAll) selAll.onclick = () => { projSel = new Set(projMarkets.map(g => g.market)); renderProjBars(); renderProjDetail(); };
      if (selNone) selNone.onclick = () => { projSel = new Set(); renderProjBars(); renderProjDetail(); };
      renderProjBars();
      renderProjDetail();
      paintProjPro(40);
    }
    const APJ_W = 'https://tmw.jake-ab7.workers.dev';
    const apjDollar = n => '$' + Math.round(n).toLocaleString('en-US');
    function renderProjBars() {
      const host = document.getElementById('apjBars'); if (!host) return;
      const lead = document.getElementById('apjLead');
      if (lead) lead.textContent = projSel.size > 1 ? ('Comparing ' + projSel.size + ' markets') : 'Projected $/sq ft at delivery · band and median, by market';
      // Shared $ scale across every market's band (falls back to median ±6%).
      const spans = projMarkets.map(g => {
        const a = projAvg[g.market];
        if (!a || !Number.isFinite(a.median)) return null;
        const lo = (a.band && Number.isFinite(a.band[0])) ? a.band[0] : a.median * 0.94;
        const hi = (a.band && Number.isFinite(a.band[1])) ? a.band[1] : a.median * 1.06;
        return { m: g.market, lo, hi, med: a.median };
      }).filter(Boolean);
      let sMin = 0, sMax = 0;
      if (spans.length) {
        sMin = Math.min(...spans.map(s => s.lo)); sMax = Math.max(...spans.map(s => s.hi));
        const pad = Math.max((sMax - sMin) * 0.06, 40); sMin -= pad; sMax += pad;
      }
      const pct = v => sMax > sMin ? Math.min(100, Math.max(0, (v - sMin) / (sMax - sMin) * 100)) : 0;
      // Price-sorted (highest median first) once values land; before that, by size.
      const ordered = projMarkets.slice().sort((x, y) => {
        const ax = projAvg[x.market], ay = projAvg[y.market];
        const mx = ax && Number.isFinite(ax.median) ? ax.median : -1;
        const my = ay && Number.isFinite(ay.median) ? ay.median : -1;
        return (my - mx) || (y.items.length - x.items.length);
      });
      host.innerHTML = ordered.map(g => {
        const sp = spans.find(s => s.m === g.market);
        const rng = sp
          ? `<span class="apj-rng"><span class="apj-rng-band" style="left:${pct(sp.lo)}%;width:${Math.max(2, pct(sp.hi) - pct(sp.lo))}%"></span><span class="apj-rng-dot" style="left:${pct(sp.med)}%"></span></span>`
          : `<span class="apj-rng"></span>`;
        const has = sp != null;
        return `<div class="apj-bar${projSel.has(g.market) ? ' sel' : ''}" data-market="${g.market}" title="${g.city}${sp ? ' · band ' + apjDollar(sp.lo) + ' – ' + apjDollar(sp.hi) : ''}">
          <span class="apj-bar-name">${g.city}</span>
          ${rng}
          <span class="apj-bar-n">${g.items.length} proj</span>
          <span class="apj-bar-val"><span class="apj-psf apj-bar-psf${has ? ' on' : ''}">${has ? apjDollar(sp.med) : '$•,•••'}</span></span>
        </div>`;
      }).join('') + (spans.length ? `<div class="apj-axis"><span>${apjDollar(sMin)}</span><span>${apjDollar((sMin + sMax) / 2)}</span><span>${apjDollar(sMax)}</span></div>` : '');
      host.querySelectorAll('.apj-bar').forEach(b => b.onclick = () => {
        const m = b.dataset.market;
        if (projSel.has(m)) projSel.delete(m); else projSel.add(m);
        renderProjBars(); renderProjDetail();
      });
    }
    function renderProjDetail() {
      const host = document.getElementById('apjDetail'); if (!host) return;
      const sel = projMarkets.filter(g => projSel.has(g.market));
      if (!sel.length) { host.innerHTML = '<div class="apj-empty">Tap a market above to see the projects behind its average.</div>'; return; }
      const head = sel.length > 1 ? `<div class="apj-cmp-k">Comparing · ${sel.map(g => g.city).join(' · ')}</div>` : '';
      const COMP_CAP = 8;   // markets with 10+ comps collapse behind Load more
      host.innerHTML = head + sel.map(g => {
        const a = projAvg[g.market];
        const capped = g.items.length >= 10 && !projExpanded.has(g.market);
        const shown = capped ? g.items.slice(0, COMP_CAP) : g.items;
        const comps = shown.map(v => `
          <a class="apj-comp" data-slug="${v.slug}" href="/projects/${encodeURIComponent(v.slug)}/">
            <span class="apj-comp-nm">${v.title}</span>
            <span class="apj-comp-sub">${v.delivery_label || v.city || ''}</span>
            <span class="apj-psf${v._psf != null ? ' on' : ''}">${v._psf != null ? apjDollar(v._psf) : '$•,•••'}</span><span class="apj-unit">/ sq ft</span>
          </a>`).join('');
        const more = capped ? `<button type="button" class="apj-more" data-more="${g.market}">Load ${g.items.length - COMP_CAP} more</button>` : '';
        return `<div class="apj-mkt" data-market="${g.market}">
          <div class="apj-mkt-head">
            <div><div class="apj-mkt-name">${g.city}</div>
              <div class="apj-mkt-sub">${g.items.length} projected project${g.items.length > 1 ? 's' : ''} · modeled, never listings</div></div>
            <div class="apj-mkt-avg"><div class="apj-avg-k">Market average · at delivery</div>
              <div class="apj-avg-row"><span class="apj-psf apj-mkt-psf${a && Number.isFinite(a.median) ? ' on' : ''}">${a && Number.isFinite(a.median) ? apjDollar(a.median) : '$•,•••'}</span><span class="apj-unit">/ sq ft</span></div>
              <div class="apj-mkt-band">Band <span class="apj-b apj-band-lo${a && a.band ? ' on' : ''}">${a && a.band ? apjDollar(a.band[0]) : '$•••'}</span> – <span class="apj-b apj-band-hi${a && a.band ? ' on' : ''}">${a && a.band ? apjDollar(a.band[1]) : '$•••'}</span></div></div>
          </div>
          <div class="apj-comps-k">Comparable set · the projects behind this average</div>
          ${comps}${more}
        </div>`;
      }).join('');
      host.querySelectorAll('[data-more]').forEach(b => b.onclick = e => {
        e.preventDefault();
        projExpanded.add(b.getAttribute('data-more'));
        renderProjDetail();
      });
      paintComps();
    }
    function paintComps() {
      if (!projMemberId) return;
      const sec = document.getElementById('atlasProjSec'); if (!sec) return;
      projMarkets.filter(g => projSel.has(g.market)).forEach(g => {
        g.items.forEach(v => {
          if (projCompDone.has(v.slug)) {
            // already fetched — re-paint into the (re-rendered) row if we have it cached
            return;
          }
          projCompDone.add(v.slug);
          fetch(APJ_W + '/atlas/projection-full', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: v.slug, member_id: projMemberId }) })
            .then(x => x.json()).then(j => {
              if (!j || !j.found || j.gated || !j.model) return;
              v._psf = j.model.proj_psf_delivery;
              const el = sec.querySelector('[data-slug="' + v.slug + '"] .apj-psf');
              if (el) { el.textContent = apjDollar(v._psf); el.classList.add('on'); }
              if (g.items.length < 2 && !projAvg[g.market]) { projAvg[g.market] = { median: v._psf, band: j.model.proj_psf_band }; renderProjBars(); renderProjDetail(); }
            }).catch(() => {});
        });
      });
      // Re-paint any cached comps whose rows just re-rendered.
      projMarkets.filter(g => projSel.has(g.market)).forEach(g => g.items.forEach(v => {
        if (v._psf != null) { const el = sec.querySelector('[data-slug="' + v.slug + '"] .apj-psf'); if (el && !el.classList.contains('on')) { el.textContent = apjDollar(v._psf); el.classList.add('on'); } }
      }));
    }
    function paintProjPro(tries) {
      const ms = window.$memberstackDom;
      if (!ms || !ms.getCurrentMember) { if (tries > 0) setTimeout(() => paintProjPro(tries - 1), 300); return; }
      ms.getCurrentMember().then(r => {
        const mem = r && r.data; if (!mem || !mem.id) return;
        projMemberId = mem.id;
        // Market averages for the chart; every market paints on load so the whole
        // comparison graph fills. Multi-project markets use the median band;
        // single-project markets use their one projection as the market figure.
        projMarkets.forEach(g => {
          if (g.items.length >= 2) {
            fetch(APJ_W + '/atlas/market-band', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ market: g.market, member_id: mem.id }) })
              .then(x => x.json()).then(j => {
                if (!j || !j.found || j.gated || !Number.isFinite(j.median_psf)) return;
                projAvg[g.market] = { median: j.median_psf, band: j.band };
                renderProjBars(); renderProjDetail();
              }).catch(() => {});
          } else if (g.items.length === 1) {
            const v = g.items[0];
            fetch(APJ_W + '/atlas/projection-full', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug: v.slug, member_id: mem.id }) })
              .then(x => x.json()).then(j => {
                if (!j || !j.found || j.gated || !j.model || !Number.isFinite(j.model.proj_psf_delivery)) return;
                v._psf = j.model.proj_psf_delivery;
                projCompDone.add(v.slug);
                projAvg[g.market] = { median: v._psf, band: j.model.proj_psf_band };
                renderProjBars(); renderProjDetail();
              }).catch(() => {});
          }
        });
        paintComps();
      }).catch(() => {});
    }

    // Sticky-bar filter chips: active filters (with ✕) when set, quick
    // dial-in state shortcuts when not — mirrors the search-bar selects.
    // Master filter → comparison chart. The chart always mirrors the page's
    // markets: active markets REPLACE the chart (its scored subset), and with
    // no market filter it falls back to the default 3-market seed comparison.
    // This is the reverse of the chart's "+ Add market" pills, which feed the
    // master filter — now both directions stay in lockstep.
    function syncCompareToMarkets() {
      try {
        if (!(supplyIntel && supplyIntel.markets)) return;
        if (atlasMarkets.length) {
          const scored = atlasMarkets.map(c => mcSlug(c)).filter(k => supplyIntel.markets[k]);
          MC.set = scored.map((k, i) => ({ k: k, slot: i }));
        } else {
          MC.set = [];
          ['miami', 'west-palm-beach', 'nashville'].forEach(k => {
            if (MC.set.length < MC_MAX && supplyIntel.markets[k]) MC.set.push({ k: k, slot: MC.set.length });
          });
        }
        mcSync();
      } catch (e) {}
    }
    function atlasSetMarkets(list) {
      atlasMarkets = (list || []).filter(Boolean).slice(0, 5);
      currentCityFilter = atlasMarkets[0] || 'ALL';
      if (atlasMarkets.length) currentStateFilter = 'ALL';
      syncCompareToMarkets();   // chart mirrors the page's markets
      syncSharedFilters();
      _pcardShown = PCARD_STEP;
      renderAll();
    }
    function atlasAddMarket(city) {
      if (!city || atlasMarkets.indexOf(city) >= 0) { renderAll(); return; }
      atlasSetMarkets(atlasMarkets.concat([city]));
    }
    function atlasDropMarket(city) {
      atlasSetMarkets(atlasMarkets.filter(c => c !== city));
    }
    function renderStickyFilters() {
      const states = (atlasData.available_states || []).slice(0, 6);
      const active = [];
      if (currentStateFilter && currentStateFilter !== 'ALL') {
        const s = (atlasData.available_states || []).find(x => x.code === currentStateFilter);
        active.push({ k: 'state', label: s ? s.label : currentStateFilter });
      }
      atlasMarkets.forEach(c => active.push({ k: 'mkt', label: c, city: c }));
      if (!atlasMarkets.length && currentCityFilter && currentCityFilter !== 'ALL') active.push({ k: 'city', label: currentCityFilter });
      if (currentTypeFilter && currentTypeFilter !== 'ALL') active.push({ k: 'type', label: currentTypeFilter });
      if (currentStatusFilter && currentStatusFilter !== 'ALL') active.push({ k: 'status', label: currentStatusFilter });
      if (currentYearFilter) active.push({ k: 'year', label: 'By end of ' + currentYearFilter });
      let inner;
      if (active.length) {
        inner = active.map(a => `<button class="ash-chip on" data-clear="${a.k}"${a.city ? ` data-city="${escapeHtml(a.city)}"` : ''}>${escapeHtml(a.label)}<span class="x">✕</span></button>`).join('')

    document.addEventListener('change', function (e) {

    document.addEventListener('click', function (e) {
      const chip = e.target.closest('#atlasStickyFilters .ash-chip');
      if (!chip) return;
      if (chip.dataset.clear === 'mkt') { atlasDropMarket(chip.dataset.city); return; }
      let mktsChanged = false;
      if (chip.dataset.state) { currentStateFilter = chip.dataset.state; currentCityFilter = 'ALL'; atlasMarkets = []; mktsChanged = true; }
      else if (chip.dataset.clear === 'state') currentStateFilter = 'ALL';
      else if (chip.dataset.clear === 'city') { currentCityFilter = 'ALL'; atlasMarkets = []; mktsChanged = true; }
      else if (chip.dataset.clear === 'type') currentTypeFilter = 'ALL';
      else if (chip.dataset.clear === 'status') currentStatusFilter = 'ALL';
      else if (chip.dataset.clear === 'year') currentYearFilter = '';
      else if (chip.dataset.clear === 'all') { atlasMarkets = []; currentStateFilter = 'ALL'; currentCityFilter = 'ALL'; currentTypeFilter = 'ALL'; currentStatusFilter = 'ALL'; currentYearFilter = ''; mktsChanged = true; }
      if (mktsChanged) syncCompareToMarkets();   // markets cleared → chart returns to the default comparison

    });

    // ── Markets directory ────────────────────────────────────────────────
    // Every market we track, ranked by pipeline size, with the supply-pressure
    // read alongside. Reuses the SAME atlas-intel.json the supply section
    // loads (supplyIntel), so this route costs no extra fetch once either has
    // been visited. Rows honour the active filter like every other route.
    function marketRows() {
      const counts = {};
      (atlasData.projects || []).forEach(p => {
        if (!p.ci) return;
        if (currentStateFilter && currentStateFilter !== 'ALL') {
          const cs = buildCityStateMap();
          if ((cs[p.ci] || 'Other') !== currentStateFilter) return;
        }
        counts[p.ci] = (counts[p.ci] || 0) + 1;
      });
      const intel = (supplyIntel && supplyIntel.markets) || {};
      return Object.keys(counts).map(city => {
        const k = String(city).toLowerCase().replace(/[^a-z0-9\s-]/g, '').replace(/[\s-]+/g, '-');
        const mk = intel[k] || null;
        return { city: city, slug: k, n: counts[city], score: mk ? mk.score : null, level: mk ? mk.level : '' };
      }).sort((a, b) => b.n - a.n);
    }
    function renderMarketsSection() {

          <h2 class="atlas-section-title">Every <em>market</em></h2>

            <span class="amk-score" style="color:${col}">${r.score != null ? r.score : ''}</span>

          <h2 class="atlas-section-title">Every <em>market</em></h2>
          <p class="atlas-section-sub">${rows.length} markets tracked, ranked by pipeline size, with supply pressure.</p>
        </div></div>
        <div class="amk-list">${body}</div>
      </section>`;

    // ── Firms directory ──────────────────────────────────────────────────
    // The full developer + architect list, not the top-10 the Builders
    // leaderboard shows. Reads firms-flat.json through the shared JSON memo,
    // so it is free when the dock or the master search already pulled it.
    let _firmsData = null, _firmsP = null;
    function loadFirms() {
      if (_firmsData || _firmsP) { if (_firmsData) return; _firmsP.then(() => renderAll()); return; }
      const j = (u) => (window.__tmwSharedJson ? window.__tmwSharedJson(u)
        : fetch(u, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null));
      _firmsP = j(MAP_ORIGIN + '/firms-flat.json').then(d => {

        if (currentRoute === 'firms') renderAll();
      });

    function renderFirmsSection() {
      if (!_firmsData) {

          <h2 class="atlas-section-title">Every <em>firm</em></h2>

        seen[f.slug] = { name: f.name, slug: f.slug, n: f.project_count, role: role };

      (_firmsData.developers || []).forEach(f => add(f, 'Developer'));

      const body = list.map(f => `<a class="amk-row" href="/firm/${escapeHtml(f.slug)}/">
          <span class="amk-city">${escapeHtml(f.name)}</span>
          <span class="amk-n">${f.n} project${f.n === 1 ? '' : 's'}</span>
          <span class="amk-lvl">${escapeHtml(f.role)}</span><span class="amk-score"></span>
        </a>`).join('');
      return `<section class="atlas-section" id="atlasFirms">
        <div class="atlas-section-head"><div>
          <h2 class="atlas-section-title">Every <em>firm</em></h2>

        </div></div>
        <div class="amk-list">${body}</div>
      </section>`;
    }

    // ── Saved views ──────────────────────────────────────────────────────
    // "Save this view" is the whole personalisation story in one control:
    // route + filter + a name. It is the same object the dashboard will pin,
    // so there is never a separate "add widget" flow to learn. Members only —
    // there is nowhere to put it for a signed-out reader.
    function viewsSignedIn() {
      try { return !!(window.__tmwMember && window.__tmwMember.id); } catch (e) { return false; }
    }
    function currentFilterObj() {
      try { return (window.tmwFilters && window.tmwFilters.get()) || {}; } catch (e) { return {}; }
    }
    var _viewsOpen = false;
    function mountViews(tries) {
      var host = document.getElementById('atlasViews');
      if (!host) return;
      if (!window.tmwViews || !viewsSignedIn()) {
        // Both arrive async (script + Memberstack). Retry briefly, then leave
        // the slot empty rather than flashing a control that cannot work.
        if ((tries || 0) < 30) { setTimeout(function () { mountViews((tries || 0) + 1); }, 300); }
        return;
      }
      window.tmwViews.list().then(function (views) {
        var f = currentFilterObj();
        var hit = window.tmwViews.matching('atlas', currentRoute, f);
        var items = views.map(function (v) {
          return '<a class="avw-item" href="' + escapeHtml(window.tmwViews.href(v)) + '" data-view="' + escapeHtml(v.id) + '">'
            + '<span class="avw-nm">' + escapeHtml(v.name) + '</span>'
            + '<button class="avw-x" type="button" data-view-del="' + escapeHtml(v.id) + '" aria-label="Remove saved view">&#10005;</button></a>';
        }).join('') || '<div class="avw-empty">No saved views yet. Filter the Atlas, then save it.</div>';
        host.innerHTML =
            '<button class="avw-save' + (hit ? ' on' : '') + '" type="button" data-view-save aria-label="Save this view">'
          +   (hit ? '&#10003; Saved' : '&#43; Save view')
          + '</button>'
          + '<div class="avw-wrap">'
          +   '<button class="avw-toggle" type="button" data-view-menu>Saved <span class="avw-n">' + views.length + '</span></button>'
          +   '<div class="avw-menu' + (_viewsOpen ? ' open' : '') + '">' + items + '</div>'
          + '</div>';
      });
    }
    // Delegated once: the sticky head is rebuilt on every render.
    document.addEventListener('click', function (e) {
      if (!window.tmwViews) return;
      var t = e.target;
      var del = t.closest && t.closest('[data-view-del]');
      if (del) {
        e.preventDefault(); e.stopPropagation();
        window.tmwViews.remove(del.getAttribute('data-view-del')).then(function () { mountViews(); });
        return;
      }
      var saveBtn = t.closest && t.closest('[data-view-save]');
      if (saveBtn) {
        e.preventDefault();
        var f = currentFilterObj();
        var hit = window.tmwViews.matching('atlas', currentRoute, f);
        // Clicking a saved view again un-saves it — same control, both ways.
        var op = hit ? window.tmwViews.remove(hit.id)
                     : window.tmwViews.save({ surface: 'atlas', route: currentRoute, filter: f });
        op.then(function () { mountViews(); });
        return;
      }
      var menu = t.closest && t.closest('[data-view-menu]');
      if (menu) { e.preventDefault(); _viewsOpen = !_viewsOpen; mountViews(); return; }
      if (_viewsOpen && !(t.closest && t.closest('.avw-wrap'))) { _viewsOpen = false; mountViews(); }
    });

    // ═══ THE MASTER CHART (v8 → live) ════════════════════════════════════
    // Markets are the series, metrics are the lens. One metric on stage at a
    // time (a dual axis invents correlations); every metric carries an (i)
    // truth label saying what the number is, where it comes from, and how
    // fresh it is. Series palette: validated 5 slots, violet first so the
    // lead market wears the brand purple.
    var MC_SLOTS=['#9085e9','#d95926','#199e70','#c98500','#d55181'];
    var MC_MAX=5;
    var MC={set:[],metric:'traj',range:0};
    var MC_ROWS=null;
    function mcSlug(t){return String(t==null?'':t).toLowerCase().trim().replace(/&/g,' and ')
      .replace(/[^a-z0-9\s-]/g,'').replace(/[\s-]+/g,'-').replace(/^-|-$/g,'');}
    function mcUnslug(k){var m=supplyIntel&&supplyIntel.markets&&supplyIntel.markets[k];
      if(m&&m.city)return m.city;
      return String(k||'').split('-').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');}
    function mcNf(n){return (+n||0).toLocaleString('en-US');}
    function mcM(n){return n>=1000?'$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'B':'$'+Math.round(n)+'M';}
    function mcRowsOf(k){return (MC_ROWS||[]).filter(function(r){return mcSlug(r.City)===k;});}
    function mcMoney(r){var n=parseFloat(r.FinancingAmountM);return isFinite(n)&&n>0?n:0;}
    function mcYear(r){var m=String(r.DeliveryDate||'').match(/(19|20)\d{2}/);return m?+m[0]:0;}
    function mcAsOf(){try{var d=new Date(supplyIntel.generated_at);
      return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}catch(e){return '';}}
    function mcQuarters(){var q={};(MC_ROWS||[]).forEach(function(r){if(!mcMoney(r))return;
      var m=String(r.FinancingDate||'').match(/(\d{4})-(\d{2})/);
      if(m)q[m[1]+'-Q'+Math.ceil(+m[2]/3)]=1;});
      return Object.keys(q).sort().slice(-8);}
    var MC_METRICS=[
      {id:'traj',name:'Delivery trajectory',unit:'units delivering per half-year',kind:'series',fmt:mcNf,
       info:function(){var lines=['<b>Modeled trend.</b> Units by delivery half-year from the TMW intel model. Only dated projects count.'];
         MC.set.forEach(function(m){var rows=mcRowsOf(m.k);if(!rows.length)return;
           var dated=rows.filter(function(r){return mcYear(r)>0;}).length;
           lines.push(mcUnslug(m.k)+': '+dated+' of '+rows.length+' projects carry a dated delivery.');});
         return lines;},
       clip:'head',
       xs:function(){var m=supplyIntel.markets[Object.keys(supplyIntel.markets)[0]];
         return (m.windows||[]).map(function(w){var y=String(w.half).slice(0,4),h1=String(w.half).indexOf('H1')>=0;
           return {m:h1?'Jan':'Jul',y:y,tip:(h1?'First half ':'Second half ')+y};});},
       series:function(k){var m=supplyIntel.markets[k];if(!m)return null;
         return (m.windows||[]).map(function(w){return w.units||0;});}},
      {id:'capt',name:'Capital raised',unit:'cumulative disclosed financing',kind:'series',fmt:function(v){return mcM(v);},
       info:function(){return ['<b>Sourced, partial by nature.</b> Running total of disclosed construction financing by quarter. Undisclosed deals are not counted, so treat this as a floor, not a total.'];},
       clip:'tail',
       xs:function(){return mcQuarters().map(function(q){var p=q.split('-');
           return {m:p[1],y:p[0],tip:p[1]+' '+p[0]};});},
       series:function(k){var qs=mcQuarters(),rows=mcRowsOf(k),cum=0;
         return qs.map(function(q){rows.forEach(function(r){var m=String(r.FinancingDate||'').match(/(\d{4})-(\d{2})/);
           if(m&&(m[1]+'-Q'+Math.ceil(+m[2]/3))===q)cum+=mcMoney(r);});return Math.round(cum);});}},
      {id:'pressure',name:'Supply pressure',unit:'score 0-100, higher = more saturated',kind:'scalar',fmt:mcNf,max:100,
       info:function(){var lines=['<b>Modeled judgment, not a listing metric.</b> Pipeline weighed against delivered stock, 0-100. The line is a <b>forward trajectory</b>: the same model run at each half-year, climbing as a wave of deliveries approaches and easing after it lands.'];
         MC.set.forEach(function(m){var mk=supplyIntel.markets[m.k];
           if(mk&&mk.confidence)lines.push(mcUnslug(m.k)+' model confidence: '+mk.confidence+'.');});
         return lines;},
       val:function(k){var m=supplyIntel.markets[k];return m?m.score:null;},
       xs:function(){var any=null,ms=supplyIntel.markets;
         Object.keys(ms).some(function(k){var s=ms[k]&&ms[k].score_series;if(s&&s.length){any=s;return true;}return false;});
         return (any||[]).map(function(pt){var mm=String(pt.half).match(/(\d{4})H(\d)/),h2=mm&&mm[2]==='2';
           return {m:h2?'Jul':'Jan',y:mm?mm[1]:'',tip:(h2?'Second half ':'First half ')+(mm?mm[1]:'')};});},
       series:function(k){var m=supplyIntel.markets[k];
         return m&&m.score_series?m.score_series.map(function(pt){return pt.score;}):null;}},
      {id:'pipeline',name:'Pipeline units',unit:'residential units tracked',kind:'scalar',fmt:mcNf,
       info:function(){return ['<b>Curated count.</b> Residential units across tracked projects, dated and undated. Unit counts come from sourced coverage and filings, not estimates.'];},
       val:function(k){var m=supplyIntel.markets[k];return m?m.pipeline_units:null;}},
      {id:'projects',name:'Tracked projects',unit:'in the TMW database',kind:'scalar',fmt:mcNf,
       info:function(){return ['<b>First-party.</b> Live count from the TMW database: hand-curated, updated by the weekly construction sweep from sourced news.'];},
       val:function(k){var n=mcRowsOf(k).length;return n||null;}},
      {id:'capital',name:'Capital tracked',unit:'disclosed financing, total',kind:'scalar',fmt:function(v){return mcM(v);},
       info:function(){return ['<b>Sourced, partial by nature.</b> Sum of disclosed financings tracked to date. A floor, not a total.'];},
       val:function(k){var c=mcRowsOf(k).reduce(function(s,r){return s+mcMoney(r);},0);return c||null;}},
      {id:'firms',name:'Active developers',unit:'distinct firms building',kind:'scalar',fmt:mcNf,
       info:function(){return ['<b>First-party.</b> Distinct developers with at least one tracked project in the market.'];},
       val:function(k){var t={};mcRowsOf(k).forEach(function(r){String(r.Developer||'').split(',')
         .forEach(function(d){d=d.trim();if(d)t[d]=1;});});
         var n=Object.keys(t).length;return n||null;}},
      {id:'keys',name:'Hotel keys',unit:'rooms in the pipeline',kind:'scalar',fmt:mcNf,
       info:function(){return ['<b>Curated count.</b> Hotel rooms across tracked pipeline projects, from sourced coverage. Blank key counts are excluded, never estimated.'];},
       val:function(k){var n=mcRowsOf(k).reduce(function(s,r){var v=parseInt(r.Keys,10);
         return s+(isFinite(v)&&v>0?v:0);},0);return n||null;}}
    ];
    function mcUsed(){return MC.set.map(function(m){return m.slot;});}
    function mcAdd(k){if(MC.set.length>=MC_MAX||MC.set.some(function(m){return m.k===k;}))return;
      var city=supplyIntel&&supplyIntel.markets&&supplyIntel.markets[k]&&supplyIntel.markets[k].city;
      if(city&&atlasMarkets.length){atlasAddMarket(city);return;}   // page pills lead when active
      var free=0;while(mcUsed().indexOf(free)>=0)free++;
      MC.set.push({k:k,slot:free});mcSync();mountMaster();}
    function mcDrop(k){
      var city=supplyIntel&&supplyIntel.markets&&supplyIntel.markets[k]&&supplyIntel.markets[k].city;
      if(city&&atlasMarkets.indexOf(city)>=0){atlasDropMarket(city);return;}
      MC.set=MC.set.filter(function(m){return m.k!==k;});mcSync();mountMaster();}
    // the master owns ?m= and ?metric=; everything else on the URL is preserved
    function mcSync(){try{var q=new URLSearchParams(location.search);
      if(MC.set.length)q.set('m',MC.set.map(function(x){return x.k;}).join(','));else q.delete('m');
      if(MC.metric!=='traj')q.set('metric',MC.metric);else q.delete('metric');
      var qs=q.toString();
      history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);}catch(e){}}
    function mcSeed(){
      if(MC.set.length||!supplyIntel||!supplyIntel.markets)return;
      var q=new URLSearchParams(location.search);
      (q.get('m')||'').split(',').map(mcSlug).filter(Boolean).slice(0,MC_MAX).forEach(function(k){
        if(supplyIntel.markets[k])MC.set.push({k:k,slot:MC.set.length});});
      var mt=q.get('metric');
      if(mt&&MC_METRICS.some(function(x){return x.id===mt;}))MC.metric=mt;
      if(MC.set.length)return;
      var seeds=[];
      try{var f=window.tmwFilters&&window.tmwFilters.get();
        if(f&&f.city&&supplyIntel.markets[f.city])seeds.push(f.city);}catch(e){}
      ['miami','west-palm-beach','nashville'].forEach(function(k){
        if(seeds.length<3&&seeds.indexOf(k)<0&&supplyIntel.markets[k])seeds.push(k);});
      seeds.forEach(function(k){MC.set.push({k:k,slot:MC.set.length});});
    }
    var mcTip=null;
    function mcTipEl(){if(mcTip)return mcTip;
      mcTip=document.createElement('div');mcTip.className='mc-tip';document.body.appendChild(mcTip);return mcTip;}
    function mcShowTip(e,frag){var t=mcTipEl();t.textContent='';t.appendChild(frag);t.classList.add('on');

      t.style.left=Math.min((e.clientX||0)+14,window.innerWidth-r.width-10)+'px';
      t.style.top=Math.max(8,(e.clientY||0)-r.height-10)+'px';}
    function mcHideTip(){if(mcTip)mcTip.classList.remove('on');}
    function mcEl(t,a){var n=document.createElementNS('http://www.w3.org/2000/svg',t);
      Object.keys(a||{}).forEach(function(k){n.setAttribute(k,a[k]);});return n;}
    function mcTxt(str,a){var t=mcEl('text',a||{});t.textContent=str;return t;}
    function renderMasterShell(){
      return '<section class="atlas-section" id="atlasMaster"><div class="atlas-panel intel" id="atlasMasterMount">'
        + '<h3 class="atlas-ph"><span class="lbl">Compare markets</span><span class="hint">loading the instrument</span></h3>'

    function mountMaster(){
      var host=document.getElementById('atlasMasterMount');
      if(!host)return;
      if(!supplyIntel||!supplyIntel.markets){loadSupplyIntel();return;}

      var al=document.createElement('div');al.className='mc-addl';am.appendChild(al);
      function renderAdd(){var q=ai.value.trim().toLowerCase();al.textContent='';

      ab.addEventListener('click',function(e){e.stopPropagation();if(MC.set.length>=MC_MAX)return;

    function mcLines(host,M){
      var xs=M.xs(),data=MC.set.map(function(m){return {k:m.k,c:MC_SLOTS[m.slot],ys:M.series(m.k)};})
        .filter(function(d){return d.ys&&d.ys.some(function(v){return v>0;});});
      // Trim trailing periods where every compared market is zero — lines all
      // marching down to 0 read as collapse, not as data running out.
      var lastNz=0;
      data.forEach(function(d){d.ys.forEach(function(v,i){if(v>0&&i>lastNz)lastNz=i;});});
      if(lastNz<xs.length-1){xs=xs.slice(0,lastNz+1);data.forEach(function(d){d.ys=d.ys.slice(0,lastNz+1);});}
      // Range window: the trajectory clips forward from now, history clips back.
      if(MC.range>0){
        var per=M.id==='capt'?4:2;                     // buckets per year
        var keep=Math.max(2,Math.round(MC.range*per));
        if(xs.length>keep){
          if(M.clip==='tail'){xs=xs.slice(-keep);data.forEach(function(d){d.ys=d.ys.slice(-keep);});}
          else{xs=xs.slice(0,keep);data.forEach(function(d){d.ys=d.ys.slice(0,keep);});}
        }
      }
      var W=1120,H=300,PL=46,PR=115,PT=14,PB=40,max=1;
      data.forEach(function(d){d.ys.forEach(function(v){if(v>max)max=v;});});
      var svg=mcEl('svg',{viewBox:'0 0 '+W+' '+H,class:'mc-svg',role:'img'});
      svg.style.width='100%';svg.style.overflow='visible';svg.style.display='block';
      var xAt=function(i){return PL+(W-PL-PR)*(xs.length<2?0:i/(xs.length-1));};
      var yAt=function(v){return PT+(H-PT-PB)*(1-v/max);};
      [0,.5,1].forEach(function(t){var y=yAt(max*t);
        svg.appendChild(mcEl('line',{x1:PL,y1:y,x2:W-PR+20,y2:y,class:'mc-gl'}));
        svg.appendChild(mcTxt(M.fmt(Math.round(max*t)),{x:0,y:y+3,class:'mc-axt'}));});
      xs.forEach(function(x,i){
        svg.appendChild(mcTxt(x.m,{x:xAt(i),y:H-20,class:'mc-axt','text-anchor':'middle'}));
        svg.appendChild(mcTxt(x.y,{x:xAt(i),y:H-6,class:'mc-axty','text-anchor':'middle'}));});
      data.forEach(function(d){
        var pd=d.ys.map(function(v,i){return (i?'L':'M')+xAt(i)+','+yAt(v);}).join(' ');
        svg.appendChild(mcEl('path',{d:pd,fill:'none',stroke:d.c,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
        var li=d.ys.length-1;
        svg.appendChild(mcEl('circle',{cx:xAt(li),cy:yAt(d.ys[li]),r:4.5,fill:d.c,stroke:'#0c0e0c','stroke-width':2}));});
      var ends=data.map(function(d){return {d:d,y:yAt(d.ys[d.ys.length-1])};}).sort(function(a,b){return a.y-b.y;});
      for(var i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<15)ends[i].y=ends[i-1].y+15;}
      ends.forEach(function(e2){

    function mcBars(host,M){
      var data=MC.set.map(function(m){return {k:m.k,c:MC_SLOTS[m.slot],v:M.val(m.k)};});
      var max=M.max||Math.max.apply(null,data.map(function(d){return d.v||0;}).concat([1]));
      var BH=26,GAP=15,LBL=150,VW=96,W=1120,H=data.length*(BH+GAP)-GAP+6;

    // Supply pressure reads as a health scale, so it gets its own line chart:
    // time on x, score 0-100 on y, one line per market whose stroke is a VERTICAL
    // gradient — colour is driven purely by height. A segment sits green when the
    // score is low, warms through yellow across the mid band, and turns red up in
    // the saturated zone, so each line shows the market climbing into (or easing
    // out of) saturation over the coming half-years.
    var MC_PRESS_BANDS=[
      {lo:0, hi:50,  c:'#1FBF6C', label:'Healthy'},
      {lo:50,hi:75,  c:'#E9B60E', label:'Balanced'},
      {lo:75,hi:100, c:'#E5484D', label:'Saturated'}
    ];
    function mcPressBand(v){for(var i=0;i<MC_PRESS_BANDS.length;i++){var z=MC_PRESS_BANDS[i];
      if(v<z.hi||i===MC_PRESS_BANDS.length-1)return z.c;}return MC_PRESS_BANDS[0].c;}
    function mcPressZone(v){return v==null?'no data':(MC_PRESS_BANDS.filter(function(z){return v<z.hi;})[0]||MC_PRESS_BANDS[2]).label;}
    function mcPressureLine(host,M){
      var xs=M.xs();
      var data=MC.set.map(function(m){return {k:m.k,ys:M.series(m.k)};})
        .filter(function(d){return d.ys&&d.ys.length;});
      if(!xs.length||!data.length){var e0=document.createElement('div');e0.className='mc-unit';
        e0.style.padding='30px 0';e0.textContent='No trajectory for the selected markets yet.';host.appendChild(e0);return;}
      // Trim trailing periods where every line has emptied out (score 0) — lines
      // marching to the floor read as collapse, not as the pipeline running dry.
      var lastNz=0;
      data.forEach(function(d){d.ys.forEach(function(v,i){if(v>0&&i>lastNz)lastNz=i;});});
      if(lastNz<xs.length-1){xs=xs.slice(0,lastNz+1);data.forEach(function(d){d.ys=d.ys.slice(0,lastNz+1);});}
      var W=1120,H=300,PL=42,PR=118,PT=20,PB=40;
      var svg=mcEl('svg',{viewBox:'0 0 '+W+' '+H,class:'mc-svg',role:'img'});
      svg.style.width='100%';svg.style.overflow='visible';svg.style.display='block';
      var xAt=function(i){return PL+(W-PL-PR)*(xs.length<2?0:i/(xs.length-1));};
      var yAt=function(v){return PT+(H-PT-PB)*(1-(+v||0)/100);};
      // vertical gradient: green->yellow->red keyed to score height. Shared by
      // every line, so any high segment is red and any low segment is green.
      var defs=mcEl('defs');
      var grad=mcEl('linearGradient',{id:'mcPressGrad',gradientUnits:'userSpaceOnUse',x1:0,y1:yAt(0),x2:0,y2:yAt(100)});
      [[0,'#1FBF6C'],[0.44,'#2FC06B'],[0.52,'#E9B60E'],[0.72,'#E7A114'],[0.80,'#E5484D'],[1,'#E5484D']]
        .forEach(function(s){grad.appendChild(mcEl('stop',{offset:(s[0]*100)+'%','stop-color':s[1]}));});
      defs.appendChild(grad);svg.appendChild(defs);
      // faint zone bands so height reads as meaning
      MC_PRESS_BANDS.forEach(function(z){svg.appendChild(mcEl('rect',
        {x:PL,y:yAt(z.hi),width:W-PL-PR,height:yAt(z.lo)-yAt(z.hi),fill:z.c,opacity:0.05}));});
      // gridlines + y labels at the band edges
      [0,50,75,100].forEach(function(t){var y=yAt(t);
        svg.appendChild(mcEl('line',{x1:PL,y1:y,x2:W-PR,y2:y,class:'mc-gl'}));
        svg.appendChild(mcTxt(String(t),{x:0,y:y+3,class:'mc-axt'}));});
      // x axis (half-year ticks)
      xs.forEach(function(x,i){
        svg.appendChild(mcTxt(x.m,{x:xAt(i),y:H-20,class:'mc-axt','text-anchor':'middle'}));
        svg.appendChild(mcTxt(x.y,{x:xAt(i),y:H-6,class:'mc-axty','text-anchor':'middle'}));});
      // one gradient line per market
      data.forEach(function(d){
        var pd=d.ys.map(function(v,i){return (i?'L':'M')+xAt(i)+','+yAt(v);}).join(' ');
        svg.appendChild(mcEl('path',{d:pd,fill:'none',stroke:'url(#mcPressGrad)','stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round'}));
        var li=d.ys.length-1,lv=d.ys[li];
        svg.appendChild(mcEl('circle',{cx:xAt(li),cy:yAt(lv),r:4.5,fill:'#0c0e0c',stroke:mcPressBand(lv),'stroke-width':2}));});
      // right-edge labels: market + latest score, colour-coded by zone, de-collided
      var ends=data.map(function(d){var lv=d.ys[d.ys.length-1];return {d:d,v:lv,y:yAt(lv)};}).sort(function(a,b){return a.y-b.y;});
      for(var i=1;i<ends.length;i++){if(ends[i].y-ends[i-1].y<15)ends[i].y=ends[i-1].y+15;}
      ends.forEach(function(e2){
        var t=mcTxt(mcUnslug(e2.d.k)+'  '+Math.round(e2.v),{x:W-PR+14,y:e2.y+4,class:'mc-vlt'});
        t.style.fill=mcPressBand(e2.v);svg.appendChild(t);
        svg.appendChild(mcEl('line',{x1:W-PR+2,y1:yAt(e2.v),x2:W-PR+11,y2:e2.y,stroke:mcPressBand(e2.v),'stroke-width':1,opacity:.7}));});
      // hover crosshair + tooltip snapping to the nearest half-year
      var cross=mcEl('line',{x1:0,y1:PT,x2:0,y2:H-PB,class:'mc-gl',opacity:0});
      svg.appendChild(cross);
      var over=mcEl('rect',{x:PL,y:PT,width:W-PL-PR,height:H-PT-PB,class:'mc-hit'});
      over.addEventListener('pointermove',function(e){
        var b=svg.getBoundingClientRect(),rel=(e.clientX-b.left)/b.width*W,best=0,bd=1e9;
        xs.forEach(function(_,i){var dd=Math.abs(xAt(i)-rel);if(dd<bd){bd=dd;best=i;}});
        cross.setAttribute('x1',xAt(best));cross.setAttribute('x2',xAt(best));cross.setAttribute('opacity',1);
        var f=document.createDocumentFragment();
        var l=document.createElement('div');l.className='tl';l.textContent=xs[best].tip;f.appendChild(l);
        data.forEach(function(d){var v=d.ys[best];var r=document.createElement('div');r.className='tr';
          var kk=document.createElement('span');kk.className='tk';kk.style.background=mcPressBand(v);r.appendChild(kk);
          var sp=document.createElement('span');sp.textContent=mcUnslug(d.k)+' · '+mcPressZone(v);r.appendChild(sp);
          var tv=document.createElement('span');tv.className='tv';tv.textContent=Math.round(v);r.appendChild(tv);
          f.appendChild(r);});
        mcShowTip(e,f);});
      over.addEventListener('pointerleave',function(){cross.setAttribute('opacity',0);mcHideTip();});
      svg.appendChild(over);
      host.appendChild(svg);

    // one document-level closer for the master menus + (i) pin

    function renderAll() {
      if (!atlasData) return;

      // One header for every route: the tabs, then any active filter chips.

        + '<div class="ash-views" id="atlasViews"></div></div>'
        + '</div>';

      if (currentRoute === 'markets') loadSupplyIntel();
      if (currentRoute === 'pipeline') {
        sections.push(stickyhead, renderStateFilter(), renderTimelineSection());
      } else {
        // Every route shares the chrome (header, rail, filters); the body is
        // what differs. Overview stays the summary of everything and links
        // into the rest — it is the app's home, not a dumping ground.
        const BODY = {
          overview: () => [renderMasterShell(), renderHeadlineTiles(), renderDashGrid(), renderSupplySection(), renderMoversSection()],
          projects: () => [renderProjectCards()],
          supply:   () => [renderSupplySection()],
          pricing:  () => [renderProjectionsSection()],
          capital:  () => [renderMoneySection()],

          firms:    () => [renderLeaderboardSection(), renderFirmsSection()]
