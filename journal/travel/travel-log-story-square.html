<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Travel Log (Square) · Markets of Tomorrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#2A2320}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center}
  /* 1080×1080 square canvas — export at native size */
  .sq{position:relative;width:1080px;height:1080px;overflow:hidden;background:#F2E9D7;color:#4A392B;
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;flex:0 0 auto;
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px}
  .eyebrow{font-size:22px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#5E4C3C;margin-bottom:34px}
  .sq h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:118px;line-height:1.02;letter-spacing:-.02em;color:#4A392B}
  .sq h1 em{font-style:italic;color:#B0603A}
</style>
</head>
<body>
<div class="sq">
  <div class="eyebrow">Travel</div>
  <h1>The travel <em>log.</em></h1>
</div>
</body>
</html>
