<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Travel — Markets of Tomorrow</title>
<link rel="icon" href="/media/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F2E9D7; --ink2:#ECE1CD; --panel:#E7DCC6; --hair:rgba(74,57,43,.13); --hair2:rgba(74,57,43,.22);
    --text:#4A392B; --mute:#8C7862; --mute2:#5E4C3C; --white:#3E2F22;
    --purple-soft:#B0603A; --gold:#B58A35; --cream:#F3EBDC; --brown:#4A392B; --terra:#B0603A;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; --serif:'Fraunces',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .wrap{max-width:960px;margin:0 auto;padding:0 22px}

  /* top wordmark */
  .top{padding:26px 0 0;text-align:center}
  .wordmark{display:inline-block;font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--brown)}
  .wordmark span{color:var(--terra)}

  /* header */
  header.hero{padding:56px 0 30px;text-align:center}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--mute2);margin-bottom:18px}
  header.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(40px,7vw,68px);line-height:1.02;letter-spacing:-.02em;color:var(--brown)}
  header.hero h1 em{font-style:italic;color:var(--terra)}
  .sub{margin:18px auto 0;max-width:46ch;font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.4vw,20px);color:#6E5844;line-height:1.5}
  .rule{max-width:960px;margin:44px auto 8px;height:1px;background:var(--hair2)}

  /* trips list */
  .trips{padding:12px 0 70px}
  .trip{display:grid;grid-template-columns:minmax(0,44%) 1fr;gap:30px;align-items:center;
        padding:26px;border:1px solid var(--hair);border-radius:20px;background:linear-gradient(180deg,#FBF6EC 0%,var(--cream) 100%);
        margin-top:22px;box-shadow:0 8px 30px rgba(74,57,43,.07)}
  a.trip{transition:transform .18s,box-shadow .18s,border-color .18s}
  a.trip:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(74,57,43,.14);border-color:var(--terra)}

  /* image / placeholder */
  .trip-img{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/11;background:var(--panel);border:1px solid var(--hair)}
  .trip-img img{width:100%;height:100%;object-fit:cover}
  .trip-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
  .trip-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.22))}
  .trip-ph .ph-name{position:relative;z-index:1;font-family:var(--serif);font-weight:600;font-size:clamp(20px,3vw,27px);line-height:1.12;color:#FBF6EC;letter-spacing:-.01em;text-shadow:0 2px 14px rgba(40,25,12,.4)}

  /* body */
  .trip-body{min-width:0}
  .trip-date{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute2)}
  .trip-title{font-family:var(--serif);font-weight:600;font-size:clamp(24px,3.4vw,32px);line-height:1.1;letter-spacing:-.01em;color:var(--brown);margin-top:9px}
  .trip-place{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--purple-soft);margin-top:5px}
  .trip-partners{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .trip-pill{font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--mute2);border:1px solid var(--hair2);border-radius:99px;padding:6px 12px;background:rgba(176,96,58,.05);white-space:nowrap}
  .p-lead{color:var(--mute);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;align-self:center;margin-right:2px}
  .trip-link{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--terra)}
  .trip-link .arw{transition:transform .18s}
  a.trip:hover .trip-link .arw{transform:translateX(4px)}
  .upcoming-tag{display:inline-block;margin-left:10px;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);border:1px solid rgba(176,96,58,.4);border-radius:99px;padding:3px 9px;vertical-align:middle;background:rgba(176,96,58,.06)}

  footer.f{text-align:center;padding:34px 0 60px;color:var(--mute);font-size:12px;letter-spacing:.04em;border-top:1px solid var(--hair)}
  footer.f .fm{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--mute2);margin-bottom:8px}

  @media(max-width:640px){
    .trip{grid-template-columns:1fr;gap:18px;padding:18px}
    .trip-img{aspect-ratio:16/10}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="wordmark" href="https://www.oftmw.com">Markets of Tomorrow</a></div>
  <header class="hero">
    <div class="eyebrow">Travel</div>
    <h1>The travel <em>log.</em></h1>
    <p class="sub">Every journey we curate — the destinations, the stays, and the partners who make them.</p>
  </header>
</div>
<div class="rule"></div>
<div class="wrap">
  <main class="trips" id="trips"></main>
  <footer class="f"><div class="fm">More miles ahead.</div>Markets of Tomorrow · Travel</footer>
</div>

<script>
// Newest first. `href` = clickable (has a detail page); past trips have none.
// `img` empty → an elegant gradient placeholder tile (drop a URL in later).
var TRIPS = [
  { title:'Italy, The Isles & The Alps', place:'Italy · Greece · Switzerland', date:'September 3 — October 10, 2026',
    href:'/travel/2026/europe/', upcoming:true, img:'', partners:['J/PR'] },
  { title:'Bimini', place:'Bimini, Bahamas', date:'May 27 — 30, 2026', img:'', partners:['Private'] },
  { title:'Four Seasons Fort Lauderdale', place:'Fort Lauderdale, Florida', date:'May 8 — 10, 2026', img:'', partners:['Four Seasons'] },
  { title:'Tokyo', place:'Tokyo, Japan', date:'April 21 — 26, 2026', img:'', partners:[] },
  { title:'Hawaii', place:'Maui · Kauai, Hawaii', date:'March 18 — April 21, 2026', img:'',
    partners:['Quinn PR','C&R PR','REM Public Relations','Andaz Maui','Princeville Makai','Puakea','Alohalani','Koa Kea Resort','Hokuala'] },
  { title:'New York City', place:'New York, New York', date:'March 5 — 8, 2026', img:'',
    partners:['Carli PR','Starlet PR','Slate Aviation'] },
  { title:'Cabot Citrus Farms', place:'Brooksville, Florida', date:'December 11 — 14, 2025', img:'', partners:['Cabot'] },
  { title:'The Florida Keys', place:'Florida, USA', date:'December 6 — 10, 2025', img:'',
    partners:['Bacchus','Little Palm Island','Three Waters Resort'] },
];

// Warm Mediterranean gradients for placeholder tiles, cycled by index.
var PH = [
  'linear-gradient(135deg,#E8C9A0,#B0603A)',
  'linear-gradient(135deg,#CDB88C,#8A6D3B)',
  'linear-gradient(135deg,#D9A679,#A8813A)',
  'linear-gradient(135deg,#C98A6A,#7A4A2E)',
  'linear-gradient(135deg,#E1C08E,#9C5C34)',
  'linear-gradient(135deg,#CBA678,#6E4A2C)',
];
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function imgHtml(t, i){
  if(t.img) return '<img loading="lazy" src="'+esc(t.img)+'" alt="'+esc(t.title)+'">';
  return '<div class="trip-ph" style="background:'+PH[i % PH.length]+'"><div class="ph-name">'+esc(t.title)+'</div></div>';
}
function partnersHtml(list){
  if(!list || !list.length) return '';
  return '<div class="trip-partners"><span class="p-lead">Partners</span>'
    + list.map(function(p){ return '<span class="trip-pill">'+esc(p)+'</span>'; }).join('')
    + '</div>';
}
function tripHtml(t, i){
  var inner =
      '<div class="trip-img">'+imgHtml(t, i)+'</div>'
    + '<div class="trip-body">'
    +   '<div class="trip-date">'+esc(t.date)+(t.upcoming?'<span class="upcoming-tag">Upcoming</span>':'')+'</div>'
    +   '<h2 class="trip-title">'+esc(t.title)+'</h2>'
    +   '<div class="trip-place">'+esc(t.place)+'</div>'
    +   partnersHtml(t.partners)
    +   (t.href ? '<span class="trip-link">View itinerary <span class="arw">→</span></span>' : '')
    + '</div>';
  return t.href
    ? '<a class="trip" href="'+esc(t.href)+'">'+inner+'</a>'
    : '<article class="trip">'+inner+'</article>';
}
document.getElementById('trips').innerHTML = TRIPS.map(tripHtml).join('');
</script>
</body>
</html>
