<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team hero — interactive</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1FDF67; --green-soft:#42EB81;
  --purple:#A78BFA; --purple-glow:#B9A6FF;
  --gold:#e6c574; --gold-soft:#f0d68a;
  --ink:#070807; --white:#fff; --cream:#ECEAE5; --mute:#9AA39C; --mute2:#C2C9C3;
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.14);
  --sans:'Inter',sans-serif; --serif:'Fraunces',Georgia,serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink); color:var(--cream); font-family:var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden}
img{display:block}
a{color:inherit}

/* ── drifting purple ambience ─────────────────────────────────── */
.amb{position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(10px);
  background:radial-gradient(680px 560px at 22% 32%, rgba(167,139,250,.30), transparent 60%),
            radial-gradient(620px 540px at 82% 62%, rgba(185,166,255,.22), transparent 60%),
            radial-gradient(520px 460px at 60% 12%, rgba(111,168,255,.10), transparent 60%),
            radial-gradient(540px 480px at 12% 92%, rgba(167,139,250,.18), transparent 60%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
@media(prefers-reduced-motion:reduce){.amb{animation:none}}

/* live dot (used by the eyebrow) */
.live-dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ── hero ─────────────────────────────────────────────────────── */
.hero{position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; padding:40px 0}
.wrap{max-width:1200px; margin:0 auto; padding:0 48px; width:100%}
.hgrid{display:grid; grid-template-columns:260px 1fr; gap:60px; align-items:center}

/* interactive photo */
.pcard{position:relative; perspective:1000px; flex:0 0 auto}
.pcard .frame{position:relative; border-radius:20px; overflow:hidden; aspect-ratio:1/1; border:1px solid rgba(167,139,250,.22);
  transform-style:preserve-3d; transition:transform .18s ease-out;
  box-shadow:0 24px 60px -30px rgba(167,139,250,.38), 0 0 0 1px rgba(167,139,250,.07)}
.pcard .frame img{width:100%; height:100%; object-fit:cover; object-position:center 16%}
.pcard .frame::after{content:""; position:absolute; inset:0; background:radial-gradient(circle at var(--gx,50%) var(--gy,40%), rgba(185,166,255,.28), transparent 55%); opacity:0; transition:opacity .25s; pointer-events:none}
.pcard:hover .frame::after{opacity:1}
.pcard .badge{position:absolute; left:16px; bottom:16px; z-index:2; display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#fff; background:rgba(167,139,250,.26); border:1px solid rgba(167,139,250,.45); padding:8px 13px; border-radius:999px; backdrop-filter:blur(10px); transform:translateZ(40px)}

/* text column */
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--green); font-weight:700; margin-bottom:22px; display:flex; align-items:center; gap:10px}
.hname{font-family:var(--serif); font-weight:900; font-size:clamp(52px,7vw,104px); letter-spacing:-.035em; line-height:.94; color:var(--white); text-shadow:0 0 90px rgba(167,139,250,.45); margin-bottom:24px}
.rot{font-family:var(--serif); font-weight:300; font-size:clamp(19px,2.1vw,27px); color:var(--cream); line-height:1.4; margin-bottom:40px}
.rot .word{color:var(--purple-glow); font-style:italic; font-weight:400; text-shadow:0 0 26px rgba(167,139,250,.6); display:inline-block; min-width:5ch; transition:opacity .32s, transform .32s}
.rot .word.out{opacity:0; transform:translateY(-8px)}
.stats{display:flex; gap:16px; margin-bottom:40px; flex-wrap:wrap}
.stat{flex:1 1 0; min-width:130px; padding:20px 22px; border-radius:16px; border:1px solid var(--hair); background:rgba(255,255,255,.03); transition:.25s; position:relative; overflow:hidden}
.stat:hover{border-color:rgba(167,139,250,.5); background:rgba(167,139,250,.07); transform:translateY(-3px); box-shadow:0 20px 50px -20px rgba(167,139,250,.5)}
.stat b{font-family:var(--serif); font-weight:600; font-size:34px; color:var(--white); display:block; line-height:1; letter-spacing:-.02em; text-shadow:0 0 30px rgba(167,139,250,.35)}
.stat span{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); margin-top:11px; display:block}
.actions{display:flex; gap:12px; flex-wrap:wrap}
.btn{display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:999px; font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; text-decoration:none; transition:.2s; border:1px solid transparent}
.btn svg{width:15px; height:15px}
.btn.g{background:rgba(31,223,103,.10); border-color:rgba(31,223,103,.4); color:var(--green-soft)}
.btn.g:hover{background:rgba(31,223,103,.2); border-color:var(--green); transform:translateY(-1px)}
.btn.p{background:rgba(167,139,250,.10); border-color:rgba(167,139,250,.4); color:var(--purple-glow)}
.btn.p:hover{background:rgba(167,139,250,.2); border-color:var(--purple-glow); transform:translateY(-1px)}

@media(max-width:860px){
  .hgrid{grid-template-columns:1fr; gap:34px; text-align:left}
  .pcard{max-width:300px}
  .wrap{padding:0 28px}
}
</style>
</head>
<body>
<div class="amb"></div>

<!-- interactive hero -->
<section class="hero">
  <div class="wrap">
    <div class="hgrid">
      <div class="pcard" id="pcard">
        <div class="frame" id="frame">
          <img src="/team/jake-nicholas.jpg" alt="Jake Nicholas">
          <span class="badge">Founder &amp; CEO</span>
        </div>
      </div>
      <div>
        <div class="eyebrow"><span class="live-dot"></span>Founder &amp; CEO &middot; Markets of Tomorrow</div>
        <h1 class="hname">Jake Nicholas</h1>
        <p class="rot">Building the intelligence layer for the future of <span class="word" id="rot">hospitality</span>.</p>
        <div class="stats">
          <div class="stat"><b data-to="8" data-suf="M+" id="s1">0</b><span>Monthly reach</span></div>
          <div class="stat"><b data-to="1000" data-suf="+" id="s2">0</b><span>Tracked projects</span></div>
          <div class="stat"><b data-to="5" data-suf="" id="s3">0</b><span>Focus markets</span></div>
        </div>
        <div class="actions">
          <a class="btn g" href="mailto:jake@oftmw.com">jake@oftmw.com</a>
          <a class="btn p" href="https://www.oftmw.com/media">The platform <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
// ── count-up stats ──
function countUp(el){
  var to=+el.getAttribute('data-to'), suf=el.getAttribute('data-suf'), t0=null, dur=1400;
  function fmt(v){ return (to>=1000 ? Math.round(v).toLocaleString() : Math.round(v)) + suf; }
  function step(ts){ if(!t0)t0=ts; var k=Math.min(1,(ts-t0)/dur); var e=1-Math.pow(1-k,3); el.textContent=fmt(to*e); if(k<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
['s1','s2','s3'].forEach(function(id){ countUp(document.getElementById(id)); });

// ── rotating sector word ──
var WORDS=['hospitality','residential','golf','dining'], wi=0, wEl=document.getElementById('rot');
setInterval(function(){ wEl.classList.add('out'); setTimeout(function(){ wi=(wi+1)%WORDS.length; wEl.textContent=WORDS[wi]; wEl.classList.remove('out'); },320); },2200);

// ── photo mouse-parallax tilt + glow follow ──
var pcard=document.getElementById('pcard'), frame=document.getElementById('frame');
pcard.addEventListener('mousemove',function(e){
  var r=pcard.getBoundingClientRect(), px=(e.clientX-r.left)/r.width, py=(e.clientY-r.top)/r.height;
  frame.style.transform='rotateY('+((px-.5)*14)+'deg) rotateX('+((.5-py)*14)+'deg) translateZ(0)';
  frame.style.setProperty('--gx',(px*100)+'%'); frame.style.setProperty('--gy',(py*100)+'%');
});
pcard.addEventListener('mouseleave',function(){ frame.style.transform='rotateY(0) rotateX(0)'; });
</script>
</body>
</html>
