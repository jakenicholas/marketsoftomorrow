name: Send Newsletter (Draft)

on:
  # Chained: runs when the Tuesday scheduled generate finishes, so the draft
  # is always built from the digest generated MINUTES earlier, never stale.
  workflow_run:
    workflows: ["Generate Newsletter Digest"]
    types: [completed]
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    # Manual dispatch always runs; the chained trigger only follows a
    # SUCCESSFUL run of the SCHEDULED generate (a manual regenerate mid-week
    # must not mint a broadcast draft).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create Resend broadcast draft
        env:
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          RESEND_FROM:        ${{ secrets.RESEND_FROM }}
        run: python send_digest.py
